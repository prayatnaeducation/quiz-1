<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>शिक्षण अभिक्षमता (कठिन स्तर) - प्रयत्न क्लासेस</title>
    <style>
        /* Black & White Space-Economic & Professional Design */
        :root {
            --black: #000000;
            --dark-gray: #333333;
            --light-gray: #f9f9f9;
            --white: #ffffff;
            --border: #aaaaaa;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--light-gray);
            color: var(--black);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }
        .quiz-container {
            background-color: var(--white);
            border: 2px solid var(--black);
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 850px;
            width: 100%;
            padding: 25px;
        }
        h1 {
            text-align: center;
            border-bottom: 2px solid var(--black);
            padding-bottom: 12px;
            font-size: 24px;
            margin-top: 0;
            text-transform: uppercase;
        }
        .header-info {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            margin-bottom: 25px;
            font-size: 17px;
            border-bottom: 1px dashed var(--border);
            padding-bottom: 10px;
        }
        .question-box {
            margin-bottom: 25px;
        }
        .question-text {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 18px;
            line-height: 1.5;
            text-align: justify;
        }
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .option-btn {
            background-color: var(--white);
            color: var(--black);
            border: 1px solid var(--black);
            border-radius: 4px;
            padding: 14px 18px;
            font-size: 16px;
            text-align: left;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
            line-height: 1.5;
        }
        .option-btn:hover:not(:disabled) {
            background-color: var(--black);
            color: var(--white);
        }
        .option-btn.correct {
            background-color: #e6ffe6; 
            border-color: #008000;
            color: #008000;
            font-weight: bold;
        }
        .option-btn.wrong {
            background-color: #ffe6e6; 
            border-color: #cc0000;
            color: #cc0000;
        }
        .option-btn:disabled {
            cursor: not-allowed;
        }
        .feedback-box {
            margin-top: 25px;
            padding: 18px;
            border: 1px dashed var(--black);
            background-color: var(--light-gray);
            display: none;
            font-size: 15px;
            line-height: 1.6;
            text-align: justify;
        }
        .controls {
            margin-top: 25px;
            text-align: right;
        }
        .next-btn {
            background-color: var(--black);
            color: var(--white);
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            display: none;
            text-transform: uppercase;
        }
        .next-btn:hover {
            background-color: var(--dark-gray);
        }
        .result-screen {
            text-align: center;
            display: none;
            padding: 30px 0;
        }
        .result-screen h2 {
            font-size: 30px;
            margin-bottom: 15px;
        }
        .result-screen p {
            font-size: 20px;
            line-height: 1.6;
        }
        .restart-btn {
            background-color: var(--white);
            color: var(--black);
            border: 2px solid var(--black);
            padding: 12px 25px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 25px;
            border-radius: 4px;
        }
        .restart-btn:hover {
            background-color: var(--black);
            color: var(--white);
        }
        .difficulty-badge {
            font-size: 12px;
            background: var(--black);
            color: var(--white);
            padding: 3px 8px;
            border-radius: 12px;
            vertical-align: middle;
            margin-left: 10px;
        }

        /* Responsive */
        @media (max-width: 600px) {
            h1 { font-size: 20px; }
            .question-text { font-size: 16px; }
            .option-btn { font-size: 14px; padding: 12px; }
            .feedback-box { font-size: 14px; }
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <h1>प्रयत्न क्लासेस - शिक्षण अभिक्षमता (कठिन स्तर)</h1>
    
    <div id="quiz-area">
        <div class="header-info">
            <span id="question-counter">प्रश्न: 1 / 50</span>
            <span id="score-display">स्कोर: 0</span>
        </div>

        <div class="question-box">
            <div id="question-text" class="question-text">प्रश्न यहाँ आएगा...</div>
            <div id="options-container" class="options-container">
                <!-- Options injected via JS -->
            </div>
        </div>

        <div id="feedback-box" class="feedback-box">
            <!-- Rationale injected via JS -->
        </div>

        <div class="controls">
            <button id="next-btn" class="next-btn" onclick="nextQuestion()">अगला प्रश्न ➔</button>
        </div>
    </div>

    <div id="result-screen" class="result-screen">
        <h2>क्विज़ समाप्त!</h2>
        <p>आपका कुल स्कोर: <strong id="final-score">0</strong> / 50</p>
        <p id="performance-msg"></p>
        <button class="restart-btn" onclick="restartQuiz()">क्विज़ पुनः प्रारंभ करें</button>
    </div>
</div>

<script>
    // 50 Difficult/Scenario-Based Teaching Aptitude Questions
    const quizData = [
        {
            question: "यदि कोई छात्र कक्षा में 'अधिगम अक्षमता' (Learning Disability) से ग्रसित है, तो एक समावेशी शिक्षक के रूप में आपकी सबसे सटीक वैज्ञानिक रणनीति क्या होगी?",
            options: [
                "उसे अन्य सामान्य छात्रों के साथ कठोर प्रतिस्पर्धा करने के लिए लगातार प्रेरित करना",
                "उसकी व्यक्तिगत संज्ञानात्मक शैली के अनुसार अपनी शिक्षण विधियों को अनुकूलित करना",
                "उसे कक्षा के सबसे होशियार छात्र के साथ बैठाकर उसी के अनुसार पढ़ने का निर्देश देना",
                "उसके लिए संपूर्ण पाठ्यक्रम को आधा कर देना ताकि वह बिना मेहनत के पास हो सके"
            ],
            correct: 1,
            rationale: "अधिगम अक्षमता वाले छात्रों के लिए 'भेदभावपूर्ण' या 'कम किया गया' पाठ्यक्रम नहीं, बल्कि 'अनुकूलित' (Adapted) शिक्षण विधियों की आवश्यकता होती है।"
        },
        {
            question: "विद्यालयी परिवेश में 'क्रियात्मक अनुसंधान' (Action Research) करने का प्राथमिक और सबसे महत्वपूर्ण उद्देश्य क्या होता है?",
            options: [
                "शिक्षाशास्त्र के क्षेत्र में एक नए और व्यापक सार्वभौमिक सिद्धांत का निर्माण करना",
                "विद्यालय या कक्षा की किसी तात्कालिक और स्थानीय समस्या का वैज्ञानिक समाधान खोजना",
                "शिक्षकों को भविष्य में विश्वविद्यालय स्तर के पीएचडी शोध कार्यों के लिए तैयार करना",
                "शिक्षा विभाग से विद्यालय के बुनियादी ढांचे के लिए अधिक वित्तीय अनुदान प्राप्त करना"
            ],
            correct: 1,
            rationale: "क्रियात्मक अनुसंधान (Action Research) हमेशा स्थानीय, तात्कालिक और कक्षा-स्तर की समस्याओं को हल करने के लिए किया जाता है, न कि वैश्विक सिद्धांत बनाने के लिए।"
        },
        {
            question: "एक छात्र अक्सर आपके विषय की कक्षा में पीछे बैठकर चित्र बनाता रहता है। एक मनोवैज्ञानिक दृष्टिकोण से, शिक्षक को सबसे पहले क्या करना चाहिए?",
            options: [
                "उसकी चित्रकला पुस्तिका को तुरंत फाड़ देना चाहिए और उसे कठोर चेतावनी देनी चाहिए",
                "कक्षा के बाद उसे बुलाकर उसकी कला की प्रशंसा करते हुए उसे विषय से जोड़ने का प्रयास करना चाहिए",
                "उसे कक्षा से बाहर निकालकर प्रधानाचार्य के पास कड़ी अनुशासनात्मक कार्रवाई हेतु भेजना चाहिए",
                "उसे पूरी कक्षा के सामने खड़ा करके उसकी इस आदत के लिए उसे बुरी तरह अपमानित करना चाहिए"
            ],
            correct: 1,
            rationale: "छात्र की छिपी हुई प्रतिभा (चित्रकला) को दबाने के बजाय, उसे एक शिक्षण उपकरण (TLM) के रूप में विषयवस्तु (Subject matter) से जोड़ना रचनात्मक शिक्षण है।"
        },
        {
            question: "'रचनावादी शिक्षण' (Constructivist Teaching) के अनुसार, कक्षा में एक शिक्षक की भूमिका को किस रूप में सबसे बेहतर परिभाषित किया जा सकता है?",
            options: [
                "ज्ञान के एकमात्र और पूर्ण हस्तांतरणकर्ता के रूप में जो सूचनाएं प्रदान करता है",
                "एक सख्त नियंत्रक के रूप में जो कक्षा की हर गतिविधि को अपनी मर्जी से चलाता है",
                "एक सुगमकर्ता (Facilitator) के रूप में जो छात्रों को स्वयं ज्ञान निर्माण में मदद करता है",
                "एक मूक दर्शक के रूप में जो छात्रों को बिना किसी दिशा-निर्देश के पूरी तरह छोड़ देता है"
            ],
            correct: 2,
            rationale: "जीन पियाजे और वाइगोत्स्की के रचनावाद के अनुसार, बच्चे सक्रिय ज्ञान-निर्माता होते हैं, और शिक्षक केवल एक सुगमकर्ता (Facilitator) या मचान (Scaffolding) प्रदान करने वाला होता है।"
        },
        {
            question: "सतत एवं व्यापक मूल्यांकन (CCE) प्रणाली में 'निदानात्मक परीक्षण' (Diagnostic Testing) का मुख्य उद्देश्य क्या होता है?",
            options: [
                "सत्रांत परीक्षा के लिए छात्रों की समग्र ग्रेडिंग और रैंकिंग का अंतिम निर्धारण करना",
                "छात्रों की अधिगम संबंधी विशिष्ट कमियों और कठिनाइयों के मूल कारणों की पहचान करना",
                "कक्षा में सबसे होशियार और सबसे कमजोर छात्रों के बीच एक स्पष्ट विभाजन रेखा खींचना",
                "शिक्षकों की वार्षिक वेतन वृद्धि के लिए उनके शिक्षण प्रदर्शन का मात्रात्मक आकलन करना"
            ],
            correct: 1,
            rationale: "निदानात्मक परीक्षण (Diagnostic) ठीक एक डॉक्टर के टेस्ट की तरह होता है, जिसका उद्देश्य बीमारी (सीखने की कमी) का कारण जानना होता है, जिसके बाद उपचारात्मक (Remedial) शिक्षण दिया जाता है।"
        },
        {
            question: "एक नव-नियुक्त शिक्षक अपनी पहली कक्षा में छात्रों का ध्यान आकर्षित करने में विफल रहता है। उसे अपने अगले कदम के रूप में क्या सुधार करना चाहिए?",
            options: [
                "छात्रों को डराने के लिए तुरंत बहुत सख्त नियम और कठोर दंड का प्रावधान लागू करना चाहिए",
                "अपनी शिक्षण विधियों, पूर्व-ज्ञान संयोजन और प्रस्तुतीकरण के तरीके का आत्म-मूल्यांकन करना चाहिए",
                "प्रधानाचार्य से शिकायत करनी चाहिए कि उस कक्षा के सभी छात्र अत्यधिक अनुशासनहीन हैं",
                "अपना पढ़ाना जारी रखना चाहिए क्योंकि समय के साथ छात्र अपने आप ध्यान देने लग जाएंगे"
            ],
            correct: 1,
            rationale: "प्रभावी शिक्षण का पहला नियम 'आत्म-मूल्यांकन' है। यदि छात्र रुचि नहीं ले रहे हैं, तो गलती छात्रों की नहीं, बल्कि शिक्षण पद्धति की हो सकती है।"
        },
        {
            question: "राष्ट्रीय शिक्षा नीति (NEP 2020) के अनुसार, प्राथमिक स्तर पर शिक्षा का माध्यम (Medium of Instruction) क्या होना चाहिए?",
            options: [
                "केवल और केवल मानकीकृत अंग्रेजी भाषा ताकि बच्चे वैश्विक स्तर पर प्रतिस्पर्धा कर सकें",
                "केवल राष्ट्रभाषा हिंदी ताकि संपूर्ण देश में एक समान भाषाई अखंडता स्थापित की जा सके",
                "जहाँ तक संभव हो, कक्षा 5 तक मातृभाषा, स्थानीय भाषा या क्षेत्रीय भाषा होनी चाहिए",
                "विदेशी भाषाओं का प्रारंभिक ज्ञान ताकि छात्र कम उम्र से ही बहुभाषी बन सकें"
            ],
            correct: 2,
            rationale: "NEP 2020 स्पष्ट रूप से अनुशंसा करती है कि कम से कम ग्रेड 5 तक शिक्षा का माध्यम मातृभाषा/स्थानीय भाषा होनी चाहिए ताकि संज्ञानात्मक समझ बेहतर हो सके।"
        },
        {
            question: "यदि एक प्रतिभाशाली (Gifted) छात्र कक्षा की सामान्य गतिविधियों से जल्दी ऊब जाता है और बाधा उत्पन्न करता है, तो आप क्या करेंगे?",
            options: [
                "उसे कक्षा के बाहर खड़ा कर देंगे ताकि अन्य सामान्य छात्रों की पढ़ाई बिल्कुल बाधित न हो",
                "उसे उसी स्तर का अधिक मात्रा में गृहकार्य देंगे ताकि वह लंबे समय तक व्यस्त रह सके",
                "उसके संज्ञानात्मक स्तर के अनुसार उसे संवर्धित (Enriched) और चुनौतीपूर्ण कार्य प्रदान करेंगे",
                "उसे अगली उच्च कक्षा में तुरंत प्रमोट करने के लिए स्कूल प्रशासन पर अत्यधिक दबाव डालेंगे"
            ],
            correct: 2,
            rationale: "प्रतिभाशाली छात्रों को 'मात्रा' (Quantity) में अधिक काम नहीं, बल्कि 'गुणवत्ता' (Quality/Challenge) में उच्च स्तर का संवर्धित कार्य (Enrichment program) चाहिए होता है।"
        },
        {
            question: "कक्षा में 'सकारात्मक सुदृढ़ीकरण' (Positive Reinforcement) का उपयोग करते समय शिक्षक को सबसे अधिक किस बात से बचना चाहिए?",
            options: [
                "वांछित व्यवहार प्रदर्शित होने के तुरंत बाद उचित और आनुपातिक प्रशंसा करने से",
                "सुदृढ़ीकरण के रूप में हर बार महंगी भौतिक वस्तुओं या बड़े नकद पुरस्कारों का प्रयोग करने से",
                "छात्र के प्रयास और उसकी कार्य प्रक्रिया की सराहना करने से (न कि केवल अंतिम परिणाम की)",
                "छात्रों के बीच एक स्वस्थ और सहयोगात्मक अधिगम वातावरण को लगातार बढ़ावा देने से"
            ],
            correct: 1,
            rationale: "लगातार भौतिक पुरस्कार देने से बच्चे की 'आंतरिक अभिप्रेरणा' (Intrinsic motivation) नष्ट हो जाती है और वह केवल लालच (Extrinsic) के लिए काम करने लगता है।"
        },
        {
            question: "एक पिछड़े वर्ग या वंचित पृष्ठभूमि (Deprived background) से आने वाले छात्र के साथ शिक्षक का व्यवहार कैसा होना चाहिए?",

        { question: "प्रश्न 21: कक्षा शिक्षण में 'प्रस्तावना कौशल' (Introduction Skill) का मुख्य मनोवैज्ञानिक उद्देश्य क्या होता है?", options: ["छात्रों को पाठ की गंभीरता से डराना ताकि वे पूरी कक्षा के दौरान बिल्कुल भी शोर न मचाएं", "शिक्षक द्वारा अपनी उच्च बौद्धिक क्षमता और भारी शब्दावली का कक्षा के सामने उत्कृष्ट प्रदर्शन करना", "छात्रों के 'पूर्व-ज्ञान' (Previous Knowledge) को नवीन ज्ञान से जोड़कर उनमें जिज्ञासा जाग्रत करना", "पाठ के अंत में पूछे जाने वाले मूल्यांकन प्रश्नों की एक लंबी सूची छात्रों को पहले ही बता देना"], correct: 2, rationale: "प्रस्तावना (Introduction) का सीधा उद्देश्य बच्चे के पूर्व ज्ञान (Known) को नए ज्ञान (Unknown) से जोड़कर एक संज्ञानात्मक पुल (Bridge) बनाना होता है।" },
        { question: "प्रश्न 22: ब्लूम के वर्गीकरण (Bloom's Taxonomy) के अनुसार, संज्ञानात्मक क्षेत्र (Cognitive Domain) का सबसे उच्चतम स्तर कौन सा है?", options: ["ज्ञान (Knowledge) - तथ्यों को याद रखना और उन्हें बिना समझे उगल देना", "अनुप्रयोग (Application) - सीखी गई बातों को नई और व्यावहारिक परिस्थितियों में लागू करना", "मूल्यांकन/सृजन (Evaluation/Creating) - सूचनाओं के आधार पर निर्णय लेना या कुछ बिल्कुल नया बनाना", "समझ (Comprehension) - जो पढ़ा गया है उसके अर्थ को अपनी मातृभाषा में अनुवादित कर पाना"], correct: 2, rationale: "संशोधित ब्लूम टैक्सोनॉमी में उच्चतम स्तर 'सृजन' (Creating) है, जबकि पुरानी टैक्सोनॉमी में यह 'मूल्यांकन' (Evaluation) था। दोनों ही चिंतन के सर्वोच्च स्तर हैं।" },
        { question: "प्रश्न 23: एक समावेशी कक्षा में दृष्टिबाधित (Visually Impaired) छात्र के लिए शिक्षक को क्या विशेष प्रबंध करने चाहिए?", options: ["उसे कक्षा के सबसे पीछे वाले कोने में बैठाना चाहिए ताकि अन्य सामान्य बच्चों को उससे कोई बाधा न हो", "उसे केवल ब्रेल लिपि की किताबें देकर स्वयं ही पढ़ने के लिए पूरी तरह से स्वतंत्र छोड़ देना चाहिए", "कक्षा में मौखिक व्याख्यान स्पष्ट रखें, स्पर्शनीय (Tactile) सामग्री का उपयोग करें और उसे आगे बैठाएं", "उसे यह सलाह देनी चाहिए कि वह सामान्य स्कूल छोड़कर किसी विशेष 'अंध विद्यालय' में ही प्रवेश ले"], correct: 2, rationale: "समावेशी शिक्षा का सिद्धांत है 'व्यवस्था में बदलाव, बच्चे में नहीं'। ऑडियो और स्पर्शनीय (Tactile) सामग्री दृष्टिबाधित छात्रों के लिए सबसे उपयुक्त है।" },
        { question: "प्रश्न 24: 'अधिगम का पठार' (Plateau of Learning) शिक्षण प्रक्रिया के दौरान किस स्थिति को सटीक रूप से परिभाषित करता है?", options: ["यह वह प्रारंभिक अवस्था है जब छात्र सबसे अधिक तीव्र गति से और बहुत उत्साह के साथ नई चीजें सीखता है", "यह सीखने की प्रक्रिया में वह ठहराव है जब प्रयास करने के बावजूद उन्नति या प्रगति शून्य प्रतीत होती है", "यह वह अंतिम अवस्था है जब छात्र विषय का पूर्ण विशेषज्ञ (Expert) बन जाता है और उसे कुछ नहीं सीखना होता", "यह वह भौतिक स्थान (कक्षा या प्रयोगशाला) है जहाँ बैठकर छात्र अपना अध्ययन कार्य संपन्न करते हैं"], correct: 1, rationale: "अधिगम वक्र (Learning Curve) में 'पठार' वह समतल क्षैतिज रेखा है जहाँ सीखने की गति कुछ समय के लिए रुक जाती है (थकान, रुचि में कमी या विधि में दोष के कारण)।" },
        { question: "प्रश्न 25: एक प्रभावी शिक्षक वह है जो कक्षा में केवल सूचनाएं नहीं देता, बल्कि...", options: ["छात्रों को उन सूचनाओं को बिना समझे रटने के लिए बहुत अधिक कठोर शारीरिक दंड का भय दिखाता है", "छात्रों में आलोचनात्मक चिंतन (Critical Thinking) और स्वतंत्र रूप से विचार करने की क्षमता विकसित करता है", "कक्षा के समय का उपयोग अपने व्यक्तिगत और राजनीतिक विचारों को छात्रों पर जबरन थोपने के लिए करता है", "परीक्षा से ठीक एक दिन पहले पूरी पुस्तक के महत्वपूर्ण प्रश्नों की एक 'शॉर्ट-कट' सूची प्रदान कर देता है"], correct: 1, rationale: "प्रभावी शिक्षण का अंतिम लक्ष्य 'स्वतंत्र और आलोचनात्मक विचारक' (Independent critical thinkers) तैयार करना है, रट्टू तोते नहीं।" },
        { question: "प्रश्न 26: 'बाल-केंद्रित शिक्षा' (Child-Centered Education) का समर्थन मुख्य रूप से किस महान दार्शनिक/मनोवैज्ञानिक ने किया था?", options: ["बी.एफ. स्किनर, जिन्होंने दंड और पुरस्कार के सख्त नियंत्रण पर सबसे अधिक जोर दिया था", "जीन जैक्स रूसो और जॉन डीवी, जिन्होंने बच्चे की स्वाभाविक प्रकृति और अनुभवों को प्राथमिकता दी", "इवान पावलव, जिन्होंने बच्चों को कुत्तों की तरह वातानुकूलित (Conditioning) करने का सिद्धांत दिया", "विल्हेम वुंट, जिन्होंने प्रयोगशाला में चेतना के संरचनात्मक तत्वों का कठोर वैज्ञानिक अध्ययन किया"], correct: 1, rationale: "रूसो (एमिल पुस्तक) और जॉन डीवी बाल-केंद्रित और प्रगतिशील शिक्षा के सबसे बड़े समर्थक माने जाते हैं।" },
        { question: "प्रश्न 27: यदि कक्षा का कोई छात्र आपसे कोई ऐसा प्रश्न पूछता है जिसका उत्तर आप बिल्कुल नहीं जानते हैं, तो एक पेशेवर शिक्षक के रूप में आप क्या करेंगे?", options: ["अपने सम्मान को बचाने के लिए तुरंत कोई भी मनगढ़ंत और अस्पष्ट उत्तर बनाकर उसे दे देंगे", "उस छात्र को पाठ्यक्रम से बाहर के अप्रासंगिक प्रश्न पूछने के लिए पूरी कक्षा के सामने बुरी तरह डांटेंगे", "ईमानदारी से स्वीकार करेंगे कि आपको उत्तर नहीं पता और अगली कक्षा में खोजकर बताने का वादा करेंगे", "उस प्रश्न को पूरी तरह से अनसुना कर देंगे और अपना पूर्व निर्धारित पाठ बिना रुके पढ़ाते रहेंगे"], correct: 2, rationale: "ईमानदारी एक शिक्षक की विश्वसनीयता (Credibility) को बढ़ाती है। झूठ बोलना या डांटना शैक्षणिक रूप से एक अपराध है।" },
        { question: "प्रश्न 28: 'बुद्धि लब्धि' (IQ) की अवधारणा के अनुसार, एक 'औसत' (Average) बुद्धि वाले छात्र का IQ स्कोर सामान्यतः किस सीमा के बीच होता है?", options: ["70 से 80 के बीच", "90 से 109 के बीच", "120 से 130 के बीच", "140 या उससे अधिक"], correct: 1, rationale: "टर्मन के वर्गीकरण के अनुसार, 90 से 109 (या 110) के बीच का IQ सामान्य या औसत (Average) बुद्धि को दर्शाता है।" },
        { question: "प्रश्न 29: शिक्षण में 'आगमन विधि' (Inductive Method) का मार्ग क्या होता है?", options: ["यह हमेशा अज्ञात से ज्ञात की ओर चलती है, जिसमें छात्र अंधेरे में तीर चलाते हैं", "यह सामान्य नियम से शुरू होकर विशिष्ट उदाहरणों की ओर जाती है (जैसे पहले व्याकरण का नियम बताना)", "यह विशिष्ट उदाहरणों से शुरू होकर एक सामान्य नियम या सिद्धांत के निर्माण तक पहुँचती है", "यह पूरी तरह से रटने पर आधारित है जिसमें न उदाहरण होते हैं और न ही कोई तार्किक नियम होता है"], correct: 2, rationale: "आगमन विधि (Inductive) में शिक्षक पहले बहुत सारे उदाहरण (Specific) देता है और फिर छात्र स्वयं नियम (General) निकालते हैं (उदाहरण से नियम की ओर)।" },
        { question: "प्रश्न 30: 'जेंडर रूढ़िवादिता' (Gender Stereotyping) को कम करने के लिए शिक्षक को कक्षा में क्या प्रयास करना चाहिए?", options: ["लड़कों को केवल गणित और विज्ञान, जबकि लड़कियों को केवल कला और संगीत पढ़ने के लिए प्रेरित करना चाहिए", "कक्षा में कार्यों का विभाजन इस प्रकार करना चाहिए जो पारंपरिक लिंग भूमिकाओं (जैसे लड़कियां सफाई करेंगी) को चुनौती दे", "लड़कों और लड़कियों के बैठने, खेलने और बातचीत करने की व्यवस्था को पूरी तरह से अलग-थलग कर देना चाहिए", "कक्षा में यह स्पष्ट रूप से घोषित कर देना चाहिए कि लड़के प्राकृतिक रूप से लड़कियों से अधिक बुद्धिमान होते हैं"], correct: 1, rationale: "जेंडर रूढ़िवादिता तोड़ने का सबसे अच्छा तरीका 'गैर-पारंपरिक भूमिकाएं' (Non-traditional roles) सौंपना है, जैसे लड़कों से कक्षा की सजावट करवाना और लड़कियों को खेल कप्तान बनाना।" },
        { question: "प्रश्न 31: 'फॉर्मेटिव असेसमेंट' (रचनात्मक मूल्यांकन) का सबसे उपयुक्त उपकरण निम्नलिखित में से कौन सा नहीं है?", options: ["कक्षा के दौरान पूछी जाने वाली मौखिक प्रश्नोत्तरी और चर्चाएं", "वार्षिक बोर्ड परीक्षा (Annual Board Examination)", "छात्रों द्वारा बनाई जाने वाली दैनिक पोर्टफोलियो और असाइनमेंट", "सहपाठी मूल्यांकन (Peer Assessment) और क्विज़"], correct: 1, rationale: "वार्षिक बोर्ड परीक्षा 'योगात्मक मूल्यांकन' (Summative Assessment) का उदाहरण है, रचनात्मक (Formative) का नहीं।" },
        { question: "प्रश्न 32: एक शिक्षक को अपने छात्रों के साथ कैसा पेशेवर संबंध बनाए रखना चाहिए?", options: ["एक तानाशाह अधिकारी जैसा, जिससे छात्र हर समय भयभीत रहें और कभी कोई शिकायत न कर सकें", "एक अत्यधिक घनिष्ठ मित्र जैसा, जिससे छात्र शिक्षक का सम्मान करना पूरी तरह से भूल जाएं", "एक मार्गदर्शक, दार्शनिक और सुविधाप्रदाता (Guide & Facilitator) जैसा, जो सहानुभूतिपूर्ण और मर्यादित हो", "एक पूर्णतः अजनबी व्यक्ति जैसा, जिसका छात्रों के व्यक्तिगत विकास से कोई भावनात्मक जुड़ाव न हो"], correct: 2, rationale: "मर्यादित सहानुभूति (Professional Empathy) और एक मार्गदर्शक की भूमिका शिक्षक के लिए सबसे आदर्श मानी जाती है।" },
        { question: "प्रश्न 33: 'ब्रेनस्टॉर्मिंग' (मस्तिष्क उद्वेलन) विधि का उपयोग कक्षा में मुख्य रूप से किस उद्देश्य के लिए किया जाता है?", options: ["छात्रों को बिना समझे तथ्यों को रटने के लिए मानसिक रूप से मजबूर करने हेतु", "सृजनात्मक चिंतन (Creative Thinking) और समस्या के अनेक नए समाधान उत्पन्न करने हेतु", "कक्षा के सबसे कमजोर छात्रों की सार्वजनिक रूप से पहचान करने और उन्हें अलग करने हेतु", "शिक्षक द्वारा अपना समय बचाने के लिए छात्रों को आपस में व्यर्थ उलझाए रखने हेतु"], correct: 1, rationale: "ब्रेनस्टॉर्मिंग (एलेक्स ऑस्बॉर्न द्वारा विकसित) का मुख्य उद्देश्य एक ही समस्या पर बिना किसी रोक-टोक के अनेक 'सृजनात्मक विचार' (Creative Ideas) उत्पन्न करना है।" },
        { question: "प्रश्न 34: एक छात्र अक्सर गृहकार्य (Homework) करके नहीं लाता है। समस्या के समाधान का सबसे सही मनोवैज्ञानिक क्रम क्या होगा?", options: ["कारण जानना -> माता-पिता से बात करना -> उपचारात्मक कदम उठाना -> छात्र की काउंसलिंग करना", "दंड देना -> कक्षा से बाहर निकालना -> टीसी (TC) काट देना -> कारण जानना", "निदान (कारण जानना) -> छात्र से सहानुभूतिपूर्वक चर्चा -> माता-पिता से संपर्क -> उपचारात्मक समाधान", "पूरी कक्षा के सामने बेइज्जत करना -> फिर कारण पूछना -> फिर माता-पिता को स्कूल बुलाना"], correct: 2, rationale: "मनोविज्ञान हमेशा निदान (Diagnosis - कारण जानना) से शुरू होता है और उपचार (Remedy - समाधान) पर समाप्त होता है।" },
        { question: "प्रश्न 35: 'अभिप्रेरणा' (Motivation) के पदानुक्रम सिद्धांत (Hierarchy of Needs) के जनक कौन हैं?", options: ["अब्राहम मास्लो", "सिगमंड फ्रायड", "जीन पियाजे", "अल्बर्ट बंडूरा"], correct: 0, rationale: "मास्लो का आवश्यकता पदानुक्रम सिद्धांत (Maslow's Hierarchy of Needs) शारीरिक आवश्यकताओं से शुरू होकर आत्म-सिद्धि (Self-actualization) तक पहुँचता है।" },
        { question: "प्रश्न 36: विद्यालय में 'पाठ्य सहगामी क्रियाओं' (Co-curricular Activities) को अनिवार्य करने का सबसे ठोस तर्क क्या है?", options: ["यह विद्यालय प्रबंधन को छात्रों से अतिरिक्त शुल्क (Extra Fees) वसूलने का एक कानूनी अवसर प्रदान करता है", "यह किताबी ज्ञान के बोझ को कम करके छात्रों के शारीरिक, मानसिक, सामाजिक और भावनात्मक विकास को सुनिश्चित करता है", "यह शिक्षकों को अपनी नियमित कक्षाओं में पढ़ाने की उबाऊ जिम्मेदारी से बचने का एक वैध तरीका प्रदान करता है", "यह विद्यालय को स्थानीय समाचार पत्रों और मीडिया में अपनी छवि चमकाने का एक बहुत अच्छा साधन देता है"], correct: 1, rationale: "सह-शैक्षिक गतिविधियाँ शिक्षा के 'सर्वांगीण विकास' (Holistic Development) के लक्ष्य को पूरा करती हैं, जो केवल किताबों से संभव नहीं है।" },
        { question: "प्रश्न 37: यदि कोई छात्र हकलाता (Stutters) है, तो एक कुशल शिक्षक को क्या 'नहीं' करना चाहिए?", options: ["उसे बोलने के लिए पर्याप्त और अतिरिक्त समय देना", "कक्षा के अन्य छात्रों को उसकी नकल करने से सख्ती से रोकना", "उसके वाक्यों को बीच में ही काटकर स्वयं जल्दी से पूरा कर देना", "उसका आत्मविश्वास बढ़ाने के लिए छोटे समूहों में बोलने का अवसर देना"], correct: 2, rationale: "हकलाने वाले बच्चे के वाक्य को बीच में काट देना या उसकी तरफ से बोल देना उसके आत्मविश्वास को गहरा आघात पहुँचाता है।" },
        { question: "प्रश्न 38: 'बहुबुद्धि सिद्धांत' (Theory of Multiple Intelligences) किसने दिया था, जो यह मानता है कि बुद्धि केवल एक प्रकार की नहीं होती?", options: ["अल्फ्रेड बिने (Alfred Binet)", "हावर्ड गार्डनर (Howard Gardner)", "रॉबर्ट स्टर्नबर्ग (Robert Sternberg)", "चार्ल्स स्पीयरमैन (Charles Spearman)"], correct: 1, rationale: "हावर्ड गार्डनर ने बहुबुद्धि सिद्धांत दिया था, जिसके अनुसार तार्किक, भाषाई, संगीतमय, स्थानिक, शारीरिक आदि कई प्रकार की बुद्धियाँ होती हैं।" },
        { question: "प्रश्न 39: एक शिक्षक को अपनी कक्षा में 'दृश्य-श्रव्य सामग्री' (Audio-Visual Aids) का उपयोग करते समय किस बात का विशेष ध्यान रखना चाहिए?", options: ["सामग्री इतनी जटिल और महंगी होनी चाहिए कि छात्र उसे देखकर पूरी तरह से आश्चर्यचकित और भ्रमित रह जाएं", "सामग्री विषयवस्तु (Topic) से सीधे संबंधित होनी चाहिए और पाठ के उद्देश्यों को स्पष्ट करने में सहायक होनी चाहिए", "शिक्षण सामग्री का उपयोग केवल तभी करना चाहिए जब स्कूल में किसी वरिष्ठ अधिकारी का निरीक्षण (Inspection) हो रहा हो", "सामग्री का उपयोग शिक्षक की अपनी कमियों और विषय के अधूरे ज्ञान को छिपाने के लिए एक ढाल के रूप में होना चाहिए"], correct: 1, rationale: "TLM (Teaching Learning Material) का एकमात्र उद्देश्य अधिगम को सरल और स्पष्ट बनाना है, न कि दिखावा करना।" },
        { question: "प्रश्न 40: 'अधिगम का अंतरण' (Transfer of Learning) से क्या तात्पर्य है?", options: ["एक स्कूल से दूसरे स्कूल में जाने पर छात्र द्वारा अपना पुराना सारा ज्ञान भूल जाना", "एक परिस्थिति में सीखे गए ज्ञान, कौशल या आदत का दूसरी परिस्थिति में उपयोग या प्रभाव पड़ना", "शिक्षक द्वारा अपने ज्ञान को बलपूर्वक छात्रों के दिमाग में जबरदस्ती डाल देना", "परीक्षा हॉल में एक छात्र द्वारा दूसरे छात्र की उत्तर पुस्तिका से ज्ञान की पूरी तरह से नकल कर लेना"], correct: 1, rationale: "जैसे साइकिल चलाना सीखने के बाद मोटरसाइकिल सीखना आसान हो जाता है, इसे 'सकारात्मक अधिगम अंतरण' (Positive Transfer of Learning) कहते हैं।" },
        { question: "प्रश्न 41: राष्ट्रीय पाठ्यचर्या की रूपरेखा (NCF 2005) के अनुसार, शिक्षा का मुख्य उद्देश्य क्या होना चाहिए?", options: ["छात्रों को बिना समझे रटने की विद्या में पारंगत करना ताकि वे परीक्षाओं में सर्वोच्च अंक प्राप्त कर सकें", "कक्षा की चारदीवारी के ज्ञान को विद्यालय के बाहर के वास्तविक जीवन के अनुभवों के साथ गहराई से जोड़ना", "शिक्षक-केंद्रित शिक्षा प्रणाली को और अधिक मजबूत करना जहाँ शिक्षक ही एकमात्र सर्वशक्तिमान अधिकारी हो", "केवल मोटी-मोटी और भारी पाठ्यपुस्तकों के माध्यम से ही संपूर्ण शिक्षण प्रक्रिया को सख्ती से संचालित करना"], correct: 1, rationale: "NCF 2005 के पाँच मार्गदर्शक सिद्धांतों में से एक सबसे महत्वपूर्ण सिद्धांत है- 'ज्ञान को स्कूल के बाहर के जीवन से जोड़ना'।" },
        { question: "प्रश्न 42: यदि आपकी कक्षा का वातावरण अत्यधिक शोरगुल वाला और अव्यवस्थित है, तो एक शिक्षक के रूप में आपकी सबसे बड़ी विफलता क्या मानी जाएगी?", options: ["विद्यालय के प्रधानाचार्य की प्रशासनिक सख्ती और भय का पूरी तरह से अभाव होना", "छात्रों के माता-पिता द्वारा उन्हें घर पर अनुशासन के कोई भी संस्कार न देना", "शिक्षक की अपनी शिक्षण विधियों में रोचकता और कक्षा प्रबंधन कौशल (Classroom Management) की भारी कमी होना", "कक्षा में उपस्थित छात्रों की संख्या का बहुत अधिक होना जिसे संभालना बिल्कुल असंभव हो"], correct: 2, rationale: "कक्षा का वातावरण सीधे तौर पर शिक्षक की नेतृत्व क्षमता और उसकी शिक्षण विधियों की रोचकता का प्रतिबिंब होता है।" },
        { question: "प्रश्न 43: 'समेकित शिक्षा' (Integrated Education) और 'समावेशी शिक्षा' (Inclusive Education) के बीच मुख्य दार्शनिक अंतर क्या है?", options: ["समेकित में बच्चे को स्कूल की व्यवस्था के अनुसार बदलना पड़ता है, जबकि समावेशी में स्कूल की व्यवस्था बच्चे के अनुसार बदलती है", "समेकित शिक्षा केवल अमीर बच्चों के लिए है, जबकि समावेशी शिक्षा केवल बहुत गरीब और बेसहारा बच्चों के लिए है", "इन दोनों शब्दों के बीच कोई अंतर नहीं है, ये केवल नई शिक्षा नीति के दो अलग-अलग फैंसी और सजावटी नाम हैं", "समेकित शिक्षा में केवल होशियार बच्चों को पढ़ाया जाता है, जबकि समावेशी में केवल विकलांग बच्चों को पढ़ाया जाता है"], correct: 0, rationale: "यह एक बहुत ही महत्वपूर्ण अवधारणा है। Integration (समेकन) में विकलांग बच्चे को सामान्य स्कूल में 'फिट' होना पड़ता है, जबकि Inclusion (समावेशन) में स्कूल अपनी प्रणाली को उस बच्चे के लिए 'अनुकूलित' करता है।" },
        { question: "प्रश्न 44: एक शिक्षक का 'मानसिक स्वास्थ्य' (Mental Health) शिक्षण प्रक्रिया को कैसे प्रभावित करता है?", options: ["इसका कोई प्रभाव नहीं पड़ता, क्योंकि शिक्षण एक विशुद्ध रूप से यांत्रिक और शारीरिक कार्य है", "एक मानसिक रूप से तनावग्रस्त शिक्षक कक्षा में चिड़चिड़ा हो जाता है और छात्रों के प्रति सहानुभूति पूरी तरह खो देता है", "शिक्षक का मानसिक स्वास्थ्य जितना खराब होगा, वह छात्रों को उतना ही बेहतर और कठोर अनुशासन सिखा पाएगा", "मानसिक तनाव शिक्षक की याददाश्त को बहुत तेज कर देता है जिससे वह अधिक ज्ञान बाँट सकता है"], correct: 1, rationale: "शिक्षक का मानसिक स्वास्थ्य (Emotional stability) एक स्वस्थ कक्षा वातावरण की पहली और अनिवार्य शर्त है।" },
        { question: "प्रश्न 45: छात्रों में 'आलोचनात्मक चिंतन' (Critical Thinking) विकसित करने के लिए किस प्रकार के प्रश्न सबसे अधिक सहायक होते हैं?", options: ["बंद-अंत वाले (Closed-ended) प्रश्न जिनका उत्तर केवल 'हां' या 'ना' में दिया जा सकता है", "स्मृति-आधारित (Memory-based) प्रश्न जिनमें किसी पुस्तक की सटीक परिभाषा को रटकर लिखना होता है", "खुले-अंत वाले (Open-ended) और विश्लेषणात्मक प्रश्न जो 'क्यों' और 'कैसे' पर गहराई से विचार करने को मजबूर करते हैं", "बहुविकल्पीय (Multiple choice) प्रश्न जिनमें केवल एक ही सही उत्तर को पहचान कर टिक लगाना होता है"], correct: 2, rationale: "अपसारी चिंतन (Divergent thinking) और आलोचनात्मक सोच के लिए हमेशा Open-ended (खुले-अंत वाले) प्रश्न सर्वश्रेष्ठ होते हैं जहाँ कई दृष्टिकोण संभव हों।" },
        { question: "प्रश्न 46: विद्यालय के बाहर समाज के साथ शिक्षक का संबंध कैसा होना चाहिए?", options: ["उसे समाज से पूरी तरह कटकर एक अलग-थलग संन्यासी का जीवन जीना चाहिए ताकि वह केवल पढ़ाई पर ध्यान दे सके", "उसे समाज का एक सक्रिय और सकारात्मक सदस्य होना चाहिए जो समुदाय की शैक्षिक प्रगति में अपना मार्गदर्शन दे सके", "उसे समाज में केवल तभी जाना चाहिए जब उसे अपनी पदोन्नति या किसी आर्थिक लाभ के लिए लोगों की आवश्यकता हो", "उसे स्थानीय राजनीति में अत्यधिक सक्रिय होकर समाज के लोगों के बीच आपसी झगड़े और गुटबाजी करवानी चाहिए"], correct: 1, rationale: "शिक्षक एक 'सामाजिक इंजीनियर' (Social Engineer) होता है। उसका समाज से सकारात्मक जुड़ाव विद्यालय और समुदाय के बीच एक मजबूत सेतु बनाता है।" },
        { question: "प्रश्न 47: 'निर्माणात्मक मूल्यांकन' (Formative Assessment) का मुख्य फोकस किस बात पर होता है?", options: ["'अधिगम का मूल्यांकन' (Assessment OF Learning) पर", "'अधिगम के लिए मूल्यांकन' (Assessment FOR Learning) पर", "'अधिगम के रूप में मूल्यांकन' (Assessment AS Learning) पर", "उपर्युक्त में से किसी पर भी नहीं"], correct: 1, rationale: "Formative Assessment का उद्देश्य सुधार करना होता है, इसलिए यह 'Assessment FOR Learning' (सीखने के लिए मूल्यांकन) है।" },
        { question: "प्रश्न 48: एक शिक्षक यह देखता है कि उसके द्वारा समझाई गई अवधारणा छात्रों को समझ नहीं आई है। एक चिंतनशील (Reflective) शिक्षक क्या करेगा?", options: ["छात्रों को मूर्ख मानकर उन्हें पूरी तरह से उनके हाल पर छोड़ देगा", "उसी अवधारणा को उसी पुराने तरीके से बहुत तेज आवाज में दोबारा पढ़ाएगा", "अपनी शिक्षण विधि को तुरंत बदलेगा और नए, सरल तथा व्यावहारिक उदाहरणों के साथ पुनः प्रयास करेगा", "प्रधानाचार्य से शिकायत करेगा कि छात्रों का मानसिक स्तर बहुत ही निम्न कोटि का है"], correct: 2, rationale: "Reflective Teaching (चिंतनशील शिक्षण) का अर्थ है अपनी ही कमियों को पहचानना और अपनी विधियों (Methods) में आवश्यक बदलाव लाना।" },
        { question: "प्रश्न 49: 'खेल-खेल में शिक्षा' (Play-way Method) का मनोविज्ञान मुख्य रूप से किस आयु वर्ग के लिए सबसे अधिक प्रासंगिक है?", options: ["प्राथमिक और पूर्व-प्राथमिक स्तर के बच्चों के लिए (3 से 8 वर्ष की आयु)", "माध्यमिक स्तर के किशोर छात्रों के लिए (14 से 16 वर्ष की आयु)", "विश्वविद्यालय स्तर के वयस्क शोधार्थियों के लिए (20 वर्ष से ऊपर)", "केवल उन वृद्ध नागरिकों के लिए जो जीवन के अंतिम चरण में प्रौढ़ शिक्षा प्राप्त कर रहे हों"], correct: 0, rationale: "फ्रॉबेल (किंडरगार्टन) और मोंटेसरी के अनुसार, छोटे बच्चे (Early childhood) खेल के माध्यम से अपनी मूल प्रवृत्तियों द्वारा सबसे स्वाभाविक रूप से सीखते हैं।" },
        { question: "प्रश्न 50: अंततः, एक 'महान शिक्षक' (Great Teacher) की पहचान क्या है?", options: ["वह जो केवल सूचनाएं देता है और अपना पाठ्यक्रम समय पर खत्म कर देता है", "वह जो जटिल विषयों को सरल बनाता है और अपनी विद्वता का अत्यधिक प्रदर्शन करता है", "वह जो छात्रों की आत्मा को स्पर्श करता है और उन्हें जीवन भर स्वयं सीखते रहने के लिए अभिप्रेरित (Inspire) करता है", "वह जो हर साल अपनी कक्षा के 100% छात्रों को परीक्षा में बिना समझे रटवाकर पास करवा देता है"], correct: 2, rationale: "विलियम आर्थर वार्ड का प्रसिद्ध कथन है: 'साधारण शिक्षक बताता है, अच्छा शिक्षक समझाता है, बेहतर शिक्षक करके दिखाता है, और महान शिक्षक प्रेरित (Inspires) करता है।'" }
    ];

    let currentQuestionIndex = 0;
    let score = 0;
    let answered = false;

    // DOM Elements
    const questionCounterEl = document.getElementById("question-counter");
    const scoreDisplayEl = document.getElementById("score-display");
    const questionTextEl = document.getElementById("question-text");
    const optionsContainerEl = document.getElementById("options-container");
    const feedbackBoxEl = document.getElementById("feedback-box");
    const nextBtnEl = document.getElementById("next-btn");
    const quizAreaEl = document.getElementById("quiz-area");
    const resultScreenEl = document.getElementById("result-screen");
    const finalScoreEl = document.getElementById("final-score");
    const performanceMsgEl = document.getElementById("performance-msg");

    function loadQuestion() {
        answered = false;
        feedbackBoxEl.style.display = "none";
        nextBtnEl.style.display = "none";
        optionsContainerEl.innerHTML = "";

        const currentQ = quizData[currentQuestionIndex];
        
        questionCounterEl.innerText = `प्रश्न: ${currentQuestionIndex + 1} / ${quizData.length}`;
        questionTextEl.innerHTML = `<strong>Q${currentQuestionIndex + 1}.</strong> ${currentQ.question} <span class="difficulty-badge">Hard Level</span>`;

        currentQ.options.forEach((opt, index) => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = opt;
            btn.onclick = () => selectOption(index, btn);
            optionsContainerEl.appendChild(btn);
        });
    }

    function selectOption(selectedIndex, btnElement) {
        if (answered) return;
        answered = true;

        const currentQ = quizData[currentQuestionIndex];
        const allBtns = optionsContainerEl.querySelectorAll(".option-btn");

        // Disable all buttons to prevent multiple clicks
        allBtns.forEach(btn => btn.disabled = true);

        // Check if correct or wrong
        if (selectedIndex === currentQ.correct) {
            btnElement.classList.add("correct");
            btnElement.innerHTML = `<strong>[✓ सही]</strong> ` + btnElement.innerHTML;
            score++;
            scoreDisplayEl.innerText = `स्कोर: ${score}`;
        } else {
            btnElement.classList.add("wrong");
            btnElement.innerHTML = `<strong>[✗ गलत]</strong> ` + btnElement.innerHTML;
            // Highlight the correct option
            allBtns[currentQ.correct].classList.add("correct");
            allBtns[currentQ.correct].innerHTML = `<strong>[✓ सही विकल्प]</strong> ` + allBtns[currentQ.correct].innerHTML;
        }

        // Show detailed feedback/rationale
        feedbackBoxEl.innerHTML = `<strong>📝 स्पष्टीकरण (Rationale):</strong><br><br>${currentQ.rationale}`;
        feedbackBoxEl.style.display = "block";
        nextBtnEl.style.display = "inline-block";

        if (currentQuestionIndex === quizData.length - 1) {
            nextBtnEl.innerText = "अंतिम परिणाम देखें ➔";
        }
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < quizData.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        quizAreaEl.style.display = "none";
        resultScreenEl.style.display = "block";
        finalScoreEl.innerText = score;

        let msg = "";
        let color = "";
        if (score >= 45) {
            msg = "🏆 एक्सीलेंट! आपकी वैचारिक समझ (Conceptual clarity) बहुत ही गहरी है। आप एक बेहतरीन शिक्षक बनने के योग्य हैं।";
            color = "green";
        }
        else if (score >= 35) {
            msg = "👍 बहुत अच्छा प्रयास! मनोविज्ञान और शिक्षण विधियों पर आपकी पकड़ मजबूत है, बस थोड़े और अभ्यास (Revision) की आवश्यकता है।";
            color = "blue";
        }
        else if (score >= 25) {
            msg = "⚠️ औसत प्रदर्शन। आपको विकल्पों में तार्किक भ्रम (Distractors) से बचने के लिए सिद्धांतों को गहराई से पढ़ने की आवश्यकता है।";
            color = "orange";
        }
        else {
            msg = "❌ आपका स्कोर कम है। यह एक कठिन क्विज़ था। कृपया शिक्षण अभिक्षमता की मूल अवधारणाओं (Concepts) को पुनः विस्तार से पढ़ें।";
            color = "red";
        }
        
        performanceMsgEl.innerHTML = `<span style="color: ${color}; font-weight: bold;">${msg}</span>`;
    }

    function restartQuiz() {
        currentQuestionIndex = 0;
        score = 0;
        scoreDisplayEl.innerText = `स्कोर: ${score}`;
        resultScreenEl.style.display = "none";
        quizAreaEl.style.display = "block";
        nextBtnEl.innerText = "अगला प्रश्न ➔";
        loadQuestion();
    }

    // Initialize the first question
    loadQuestion();

</script>
</body>
</html>
