            { id: 46, text: "एक बस में 40 यात्री हैं। पहले स्टॉप पर 1/4 उतरते हैं और 5 चढ़ते हैं। बस में कितने यात्री हैं?", options: { A: "30", B: "35", C: "25", D: "40" }, correct: "B", section: "मानसिक योग्यता" },
            { id: 47, text: "“अध्यापक, लेखक, पुरुष” का सही वेन आरेखः", options: { A: "तीनों एक दूसरे को काटते हुए", B: "एक बड़े वृत्त में दो अलग", C: "तीन अलग वृत्त", D: "एक के अंदर एक" }, correct: "A", section: "मानसिक योग्यता" },
            { id: 48, text: "एक आयत की लंबाई 20% बढ़ाई गई और चौड़ाई 20% कम की गई। क्षेत्रफल पर प्रभावः", options: { A: "4% वृद्धि", B: "4% कमी", C: "0%", D: "8% कमी" }, correct: "B", section: "मानसिक योग्यता" },
            { id: 49, text: "यदि 'a $ b = a + b - ab' है, तो '4 $ 5' का मान क्या होगा?", options: { A: "-11", B: "11", C: "29", D: "-29" }, correct: "A", section: "मानसिक योग्यता" },
            { id: 50, text: "4*5=41, 6*7=85, तो 8*9=?", options: { A: "145", B: "113", C: "120", D: "150" }, correct: "A", section: "मानसिक योग्यता" },

            // खंड 2: राजस्थान सामान्य ज्ञान (51-100)
            { id: 51, text: "हाल ही में राजस्थान को 50 जिलों में पुनर्गठित किया गया है। 'पचपदरा झील' अब किस नए जिले के अंतर्गत आती है?", options: { A: "बाड़मेर", B: "सांचौर", C: "बालोतरा", D: "फलोदी" }, correct: "C", section: "राज. सामान्य ज्ञान" },
            { id: 52, text: "कथन (A): राजस्थान सौर ऊर्जा क्षमता में भारत में प्रथम स्थान पर है। कारण (R): राजस्थान में 'भड़ला सोलर पार्क' (जोधपुर/फलोदी) विश्व का सबसे बड़ा सोलर पार्क है।", options: { A: "A और R दोनों सत्य हैं, R सही स्पष्टीकरण है", B: "A और R दोनों सत्य हैं, लेकिन R सही स्पष्टीकरण नहीं है", C: "A सत्य है, R असत्य है", D: "A असत्य है, R सत्य है" }, correct: "A", section: "राज. सामान्य ज्ञान" },
            { id: 53, text: "[सुमेलित करें] नए जिले और उनके मूल जिलेः a. सलूंबर (1. सीकर), b. नीम का थाना (2. उदयपुर), c. डीडवाना-कुचामन (3. जोधपुर), d. फलोदी (4. नागौर)", options: { A: "a-2, b-1, c-4, d-3", B: "a-1, b-2, c-3, d-4", C: "a-2, b-4, c-1, d-3", D: "a-4, b-3, c-2, d-1" }, correct: "A", section: "राज. सामान्य ज्ञान" },
            { id: 54, text: "'गणेश्वर सभ्यता' जो ताम्रयुगीन सभ्यताओं की जननी कहलाती है, वर्तमान में किस जिले में स्थित है?", options: { A: "सीकर", B: "नीम का थाना", C: "झुंझुनू", D: "कोटपूतली-बहरोड़" }, correct: "B", section: "राज. सामान्य ज्ञान" },
            { id: 55, text: "राजस्थान सरकार के 2025-26 के बजट के अनुसार, 'लाडो प्रोत्साहन योजना' का मुख्य उद्देश्य क्या है?", options: { A: "महिलाओं को मुफ्त स्मार्टफोन देना", B: "बालिकाओं के जन्म को प्रोत्साहित करना और उन्हें वित्तीय सहायता देना", C: "वृद्ध महिलाओं को पेंशन देना", D: "महिलाओं को रोजगार देना" }, correct: "B", section: "राज. सामान्य ज्ञान" },
            { id: 56, text: "'घग्गर नदी' (मृत नदी) के पाट को स्थानीय भाषा में क्या कहा जाता है?", options: { A: "नाली", B: "जोहड़", C: "टांका", D: "खडीन" }, correct: "A", section: "राज. सामान्य ज्ञान" },
            { id: 57, text: "कथन 1: 'हल्दीघाटी का युद्ध' 1576 में लड़ा गया था। कथन 2: कर्नल टॉड ने हल्दीघाटी को 'मेवाड़ का मैराथन' कहा है।", options: { A: "केवल कथन 1 सत्य है", B: "केवल कथन 2 सत्य है", C: "दोनों कथन सत्य हैं", D: "दोनों कथन असत्य हैं" }, correct: "A", section: "राज. सामान्य ज्ञान" },
            { id: 58, text: "राजस्थान के 'अनूपगढ़' जिले की सीमा किस देश/राज्य से लगती है?", options: { A: "पंजाब", B: "हरियाणा", C: "पाकिस्तान (अंतर्राष्ट्रीय सीमा)", D: "गुजरात" }, correct: "C", section: "राज. सामान्य ज्ञान" },
            { id: 59, text: "'चिरंजीवी स्वास्थ्य बीमा योजना' का परिवर्तित/नया स्वरूप राजस्थान में किस योजना के तहत लागू किया गया है?", options: { A: "मुख्यमंत्री आयुष्मान आरोग्य योजना", B: "भामाशाह स्वास्थ्य योजना", C: "निरोगी राजस्थान योजना", D: "आरोग्य जीवन योजना" }, correct: "A", section: "राज. सामान्य ज्ञान" },
            { id: 60, text: "'बागोर की हवेली' जहाँ विश्व की सबसे बड़ी पगड़ी रखी है, किस झील के किनारे स्थित है?", options: { A: "आनासागर", B: "पुष्कर", C: "पिछोला", D: "राजसमंद" }, correct: "C", section: "राज. सामान्य ज्ञान" },
            { id: 61, text: "[सुमेलित करें] लोक देवता और उनका मुख्य स्थानः a. रामदेवजी (1. परबतसर), b. तेजाजी (2. रुणेचा), c. पाबूजी (3. कोलू), d. गोगाजी (4. गोगामेड़ी)", options: { A: "a-2, b-1, c-3, d-4", B: "a-1, b-2, c-4, d-3", C: "a-2, b-3, c-1, d-4", D: "a-3, b-1, c-2, d-4" }, correct: "A", section: "राज. सामान्य ज्ञान" },
            { id: 62, text: "'अढ़ाई दिन का झोंपड़ा' (अजमेर) का निर्माण विग्रहराज चतुर्थ ने मूल रूप से किस इमारत के रूप में करवाया था?", options: { A: "मस्जिद", B: "संस्कृत पाठशाला", C: "जैन मंदिर", D: "राजमहल" }, correct: "B", section: "राज. सामान्य ज्ञान" },
            { id: 63, text: "'राजस्थान का मैनचेस्टर' और 'वस्त्र नगरी' किसे कहा जाता है?", options: { A: "बालोतरा", B: "भीलवाड़ा", C: "पाली", D: "अजमेर" }, correct: "B", section: "राज. सामान्य ज्ञान" },
            { id: 64, text: "राजस्थान में 1857 की क्रांति का आरंभ कहाँ से हुआ था?", options: { A: "नीमच", B: "ब्यावर", C: "नसीराबाद", D: "एरिनपुरा" }, correct: "C", section: "राज. सामान्य ज्ञान" },
            { id: 65, text: "'सीतामाता वन्यजीव अभयारण्य' (प्रतापगढ़) किसके लिए विश्व प्रसिद्ध है?", options: { A: "बाघों के लिए", B: "काले हिरण के लिए", C: "उड़न गिलहरी के लिए", D: "गोडावण के लिए" }, correct: "C", section: "राज. सामान्य ज्ञान" },
            { id: 66, text: "कथनः 'बणी-ठणी' को भारत की मोनालिसा कहा जाता है। कारणः यह किशनगढ़ चित्रकला शैली का सबसे उत्कृष्ट चित्र है जिसे निहालचंद ने बनाया था।", options: { A: "दोनों सही हैं, कारण सही व्याख्या है", B: "दोनों सही हैं, कारण गलत व्याख्या है", C: "कथन सही, कारण गलत", D: "दोनों गलत हैं" }, correct: "A", section: "राज. सामान्य ज्ञान" },
            { id: 67, text: "'सांभर झील' में नमक उत्पादन का कार्य किस केंद्र सरकार के उपक्रम द्वारा किया जाता है?", options: { A: "सांभर साल्ट लिमिटेड", B: "राजस्थान साल्ट्स लिमिटेड", C: "टाटा साल्ट्स लिमिटेड", D: "डीडवाना साल्ट्स लिमिटेड" }, correct: "A", section: "राज. सामान्य ज्ञान" },
            { id: 68, text: "राजस्थान की कौन सी नदी कर्क रेखा (Tropic of Cancer) को दो बार काटती है?", options: { A: "चंबल", B: "लूनी", C: "माही", D: "साबरमती" }, correct: "C", section: "राज. सामान्य ज्ञान" },
            { id: 69, text: "'कालबेलिया' नृत्य को यूनेस्को की अमूर्त सांस्कृतिक विरासत सूची में किस वर्ष शामिल किया गया?", options: { A: "2010", B: "2012", C: "2014", D: "2016" }, correct: "A", section: "राज. सामान्य ज्ञान" },
            { id: 70, text: "'मारवाड़ का प्रताप' (Pratap of Marwar) किसे कहा जाता है, जिसने अकबर की अधीनता स्वीकार नहीं की?", options: { A: "राव मालदेव", B: "राव चंद्रसेन", C: "उदयसिंह", D: "जसवंत सिंह" }, correct: "B", section: "राज. सामान्य ज्ञान" },
            { id: 71, text: "राजस्थान में 'जल संरक्षण' की पारंपरिक विधि 'टांका' (Tanka) मुख्य रूप से किस क्षेत्र में प्रचलित है?", options: { A: "हाड़ौती", B: "शेखावाटी", C: "पश्चिमी राजस्थान (थार)", D: "मेवाड़" }, correct: "C", section: "राज. सामान्य ज्ञान" },
            { id: 72, text: "'विजय स्तंभ' (चित्तौड़गढ़) का निर्माण राणा कुंभा ने किस विजय के उपलक्ष्य में करवाया था?", options: { A: "सारंगपुर का युद्ध", B: "खानवा का युद्ध", C: "हल्दीघाटी का युद्ध", D: "खातौली का युद्ध" }, correct: "A", section: "राज. सामान्य ज्ञान" },
            { id: 73, text: "'थेवा कला' (Thewa Art) जिसमें कांच पर सोने की बारीक कारीगरी की जाती है, किस जिले की प्रसिद्ध है?", options: { A: "प्रतापगढ़", B: "बीकानेर", C: "जयपुर", D: "बाड़मेर" }, correct: "A", section: "राज. सामान्य ज्ञान" },
            { id: 74, text: "'पूर्वी राजस्थान नहर परियोजना' (ERCP) से राजस्थान के कितने जिले लाभान्वित होंगे? (वर्तमान डेटा के अनुसार)", options: { A: "13 जिले (पुराने परिदृश्य में)", B: "5 जिले", C: "7 जिले", D: "33 जिले" }, correct: "A", section: "राज. सामान्य ज्ञान" },
            { id: 75, text: "'भोराट् का पठार' (Bhorat Plateau) किन दो स्थानों के मध्य स्थित है?", options: { A: "कुंभलगढ़ और गोगुन्दा", B: "अचलगढ़ और तारागढ़", C: "बैराठ और अलवर", D: "जयसमंद और प्रतापगढ़" }, correct: "A", section: "राज. सामान्य ज्ञान" },
            { id: 76, text: "'मत्स्य संघ' के प्रथम राजप्रमुख कौन बनाए गए थे?", options: { A: "उदयभान सिंह (धौलपुर)", B: "सवाई मानसिंह", C: "भीमसिंह", D: "तेजसिंह" }, correct: "A", section: "राज. सामान्य ज्ञान" },
            { id: 77, text: "राजस्थान की प्रथम वन नीति (First Forest Policy) कब घोषित की गई थी?", options: { A: "2008", B: "2010", C: "2012", D: "2015" }, correct: "B", section: "राज. सामान्य ज्ञान" },
            { id: 78, text: "लोक नाट्य 'गव्री' (Gavari) किस जनजाति का प्रमुख सांस्कृतिक आयोजन है?", options: { A: "सहरिया", B: "गरासिया", C: "भील", D: "मीणा" }, correct: "C", section: "राज. सामान्य ज्ञान" },
            { id: 79, text: "'राष्ट्रीय ऊंट अनुसंधान केंद्र' कहाँ स्थित है?", options: { A: "अविकानगर (टोंक)", B: "जोहड़बीड़ (बीकानेर)", C: "सेवर (भरतपुर)", D: "तबीजी (अजमेर)" }, correct: "B", section: "राज. सामान्य ज्ञान" },
            { id: 80, text: "1857 की क्रांति के समय 'पॉलिटिकल एजेंट' मैक मेसन का सिर काटकर किस किले के दरवाजे पर लटका दिया गया था?", options: { A: "आउवा (Auwa) का किला", B: "मेहरानगढ़", C: "कुंभलगढ़", D: "रणथंभौर" }, correct: "A", section: "राज. सामान्य ज्ञान" },
            { id: 81, text: "राजस्थान का राज्य वृक्ष 'खेजड़ी' का वैज्ञानिक नाम क्या है?", options: { A: "टेकोमेला अंडुलेटा", B: "प्रोसोपिस सिनेरेरिया", C: "ब्यूटिया मोनोस्पर्मा", D: "अजाडिराक्टा इंडिका" }, correct: "B", section: "राज. सामान्य ज्ञान" },
            { id: 82, text: "'ढोला-मारू' चित्र शैली मुख्य रूप से किस चित्रकला स्कूल की विशेषता है?", options: { A: "मारवाड़ (जोधपुर) शैली", B: "मेवाड़ शैली", C: "बीकानेर शैली", D: "हाड़ौती शैली" }, correct: "A", section: "राज. सामान्य ज्ञान" },
            { id: 83, text: "'छप्पनिया का अकाल' राजस्थान में किस विक्रम संवत में पड़ा था?", options: { A: "1856 वि.सं.", B: "1956 वि.सं. (1899 ई.)", C: "1999 वि.सं.", D: "2001 वि.सं." }, correct: "B", section: "राज. सामान्य ज्ञान" },
            { id: 84, text: "राजस्थान में राज्यसभा की कितनी सीटें आवंटित हैं?", options: { A: "10", B: "25", C: "30", D: "200" }, correct: "A", section: "राज. सामान्य ज्ञान" },
            { id: 85, text: "'सोम-कमला-अम्बा' सिंचाई परियोजना किस जिले से संबंधित है?", options: { A: "बांसवाड़ा", B: "डूंगरपुर", C: "उदयपुर", D: "प्रतापगढ़" }, correct: "B", section: "राज. सामान्य ज्ञान" },
            { id: 86, text: "किस देवी के मंदिर में सफेद चूहों (काबा) की पूजा की जाती है?", options: { A: "जीण माता", B: "शीतला माता", C: "करणी माता (देशनोक)", D: "आई माता" }, correct: "C", section: "राज. सामान्य ज्ञान" },
            { id: 87, text: "राजस्थान का सबसे ऊँचा पठार 'उड़िया का पठार' (Udiya Plateau) किस जिले में स्थित है?", options: { A: "राजसमंद", B: "सिरोही", C: "उदयपुर", D: "चित्तौड़गढ़" }, correct: "B", section: "राज. सामान्य ज्ञान" },
            { id: 88, text: "'बिसलपुर बांध' जो राजस्थान की सबसे बड़ी पेयजल परियोजना है, किस नदी पर स्थित है?", options: { A: "चंबल", B: "बनास", C: "लूनी", D: "बाणगंगा" }, correct: "B", section: "राज. सामान्य ज्ञान" },
            { id: 89, text: "'अजरक' और 'मलीर' प्रिंट की पारंपरिक हस्तकला किस जिले की पहचान है?", options: { A: "सांगानेर (जयपुर)", B: "बाड़मेर", C: "बगरू", D: "अकोला (चित्तौड़गढ़)" }, correct: "B", section: "राज. सामान्य ज्ञान" },
            { id: 90, text: "'तराईन का प्रथम युद्ध' (1191 ई.) किनके मध्य लड़ा गया था?", options: { A: "पृथ्वीराज चौहान और मुहम्मद गौरी", B: "महाराणा सांगा और बाबर", C: "महाराणा प्रताप और अकबर", D: "पृथ्वीराज और जयचंद" }, correct: "A", section: "राज. सामान्य ज्ञान" },
            { id: 91, text: "'चूप' (Choop) नामक आभूषण शरीर के किस अंग पर पहना जाता है?", options: { A: "नाक", B: "कान", C: "दाँत", D: "गला" }, correct: "C", section: "राज. सामान्य ज्ञान" },
            { id: 92, text: "'वंश भास्कर' की रचना किस राज्य कवि ने की थी?", options: { A: "सूर्यमल्ल मिश्रण (बूँदी)", B: "श्यामलदास", C: "मुहणोत नैणसी", D: "बांकीदास" }, correct: "A", section: "राज. सामान्य ज्ञान" },
            { id: 93, text: "'सहेलियों की बाड़ी' का निर्माण उदयपुर में किसने करवाया था?", options: { A: "महाराणा राजसिंह", B: "महाराणा संग्राम सिंह II", C: "महाराणा फतेह सिंह", D: "महाराणा उदय सिंह" }, correct: "B", section: "राज. सामान्य ज्ञान" },
            { id: 94, text: "'जोगी महल' राजस्थान के किस प्रसिद्ध दुर्ग में स्थित है?", options: { A: "चित्तौड़गढ़", B: "रणथंभौर", C: "कुंभलगढ़", D: "नाहरगढ़" }, correct: "B", section: "राज. सामान्य ज्ञान" },
            { id: 95, text: "'आभानेरी' की चांद बावड़ी किस जिले में है?", options: { A: "अलवर", B: "दौसा", C: "करौली", D: "सवाई माधोपुर" }, correct: "B", section: "राज. सामान्य ज्ञान" },
            { id: 96, text: "राजस्थान में पंचायत समिति का प्रधान अपना इस्तीफा किसे सौंपता है?", options: { A: "जिला कलक्टर", B: "जिला प्रमुख", C: "विकास अधिकारी (BDO)", D: "सरपंच" }, correct: "B", section: "राज. सामान्य ज्ञान" },
            { id: 97, text: "'मारवाड़ प्रजामंडल' की स्थापना (1934) में मुख्य भूमिका किसकी थी?", options: { A: "जयनारायण व्यास", B: "माणिक्य लाल वर्मा", C: "मीठालाल व्यास", D: "गोकुल भाई भट्ट" }, correct: "A", section: "राज. सामान्य ज्ञान" },
            { id: 98, text: "'सरिस्का टाइगर रिजर्व' राजस्थान के किस जिले में है?", options: { A: "भरतपुर", B: "अलवर", C: "सवाई माधोपुर", D: "दौसा" }, correct: "B", section: "राज. सामान्य ज्ञान" },
            { id: 99, text: "'घूमर' नृत्य मुख्य रूप से किस अवसर पर महिलाओं द्वारा किया जाता है?", options: { A: "दीपावली", B: "गणगौर / मांगलिक अवसर", C: "होली", D: "रक्षाबंधन" }, correct: "B", section: "राज. सामान्य ज्ञान" },
            { id: 100, text: "राजस्थान में 2026 के परिदृश्य में 'ग्रीन एनर्जी कॉरिडोर' का मुख्य उद्देश्य क्या है?", options: { A: "हरियाली बढ़ाना", B: "पश्चिमी राजस्थान की पवन और सौर ऊर्जा को ग्रिड से जोड़ना", C: "कृषि को बढ़ावा देना", D: "नहरों का निर्माण" }, correct: "B", section: "राज. सामान्य ज्ञान" },

            // खंड 3: शिक्षण अभिरुचि (101-150)
            { id: 101, text: "NEP 2020 के अनुसार, स्कूल शिक्षा के नए '5+3+3+4' ढांचे में प्रथम '5' वर्ष किस स्टेज को दर्शाते हैं?", options: { A: "मिडिल स्टेज", B: "प्रिपरेटरी स्टेज", C: "फाउंडेशनल स्टेज (Foundational Stage)", D: "सेकेंडरी स्टेज" }, correct: "C", section: "शिक्षण अभिरुचि" },
            { id: 102, text: "एक समावेशी कक्षा में 'डिस्लेक्सिया' (Dyslexia) से पीड़ित बच्चे को मुख्य रूप से क्या समस्या होती है?", options: { A: "गणितीय गणना में", B: "पढ़ने और शब्दों को पहचानने में", C: "सुनने में", D: "चलने-फिरने में" }, correct: "B", section: "शिक्षण अभिरुचि" },
            { id: 103, text: "स्थितिजन्य प्रश्नः आपकी कक्षा में दो छात्र आपस में लगातार लड़ते हैं। एक शिक्षक के रूप में आपका पहला कदम क्या होगा?", options: { A: "दोनों को पीटेंगे और बाहर निकालेंगे", B: "प्रधानाचार्य को सौंप देंगे", C: "दोनों को अलग बैठाएंगे और शांत होने पर लड़ाई का मूल कारण जानकर काउंसलिंग करेंगे", D: "उनके माता-पिता को तुरंत बुलाएंगे" }, correct: "C", section: "शिक्षण अभिरुचि" },
            { id: 104, text: "'PARAKH' (परख) जो NEP 2020 का एक महत्वपूर्ण हिस्सा है, किस क्षेत्र से संबंधित है?", options: { A: "मिड-डे मील", B: "छात्रों के समग्र मूल्यांकन (Assessment) के लिए राष्ट्रीय केंद्र", C: "शिक्षकों का वेतन", D: "स्कूल की बिल्डिंग" }, correct: "B", section: "शिक्षण अभिरुचि" },
            { id: 105, text: "कक्षा में 'ब्रेनस्टॉर्मिंग' (Brainstorming) तकनीक का सबसे बड़ा लाभ क्या है?", options: { A: "यह छात्रों में रटने की क्षमता बढ़ाता है", B: "यह छात्रों में रचनात्मक (Creative) और अपसारी (Divergent) सोच उत्पन्न करता है", C: "यह अनुशासन बनाए रखता है", D: "यह शिक्षक का समय बचाता है" }, correct: "B", section: "शिक्षण अभिरुचि" },
            { id: 106, text: "कथन (A): शिक्षक को कक्षा में एक सुविधाप्रदाता की भूमिका निभानी चाहिए। कारण (R): 'रचनावाद' मानता है कि बच्चे ज्ञान का निर्माण सक्रिय रूप से स्वयं करते हैं।", options: { A: "A और R दोनों सही हैं, R सही व्याख्या है", B: "A और R दोनों सही हैं, R सही व्याख्या नहीं है", C: "A सही है, R गलत है", D: "A गलत है, R सही है" }, correct: "A", section: "शिक्षण अभिरुचि" },
            { id: 107, text: "यदि कक्षा का कोई छात्र ADHD से ग्रस्त है, तो आप उसके लिए कौन सी रणनीति अपनाएंगे?", options: { A: "उसे कक्षा के पीछे एकांत में बैठाएंगे", B: "उसे छोटे, प्रबंधनीय कार्यों (Chunks) में काम देंगे और बीच-बीच में ब्रेक देंगे", C: "उसे कठोर दंड का भय दिखाएंगे", D: "उसे विशेष स्कूल भेज देंगे" }, correct: "B", section: "शिक्षण अभिरुचि" },
            { id: 108, text: "शिक्षण अधिगम प्रक्रिया में 'सतत एवं व्यापक मूल्यांकन' (CCE) का मुख्य उद्देश्य है:", options: { A: "केवल परीक्षा के अंक बढ़ाना", B: "छात्रों में परीक्षा का डर बनाए रखना", C: "छात्रों के संज्ञानात्मक और गैर-संज्ञानात्मक दोनों पक्षों का निरंतर विकास करना", D: "शिक्षकों को अधिक कागजी कार्य देना" }, correct: "C", section: "शिक्षण अभिरुचि" },
            { id: 109, text: "'सहपाठी अधिगम' (Peer Learning) से बच्चों में मुख्य रूप से क्या विकसित होता है?", options: { A: "प्रतिस्पर्धा और जलन", B: "सहयोग, संचार कौशल और सामाजिकरण", C: "अकेलापन", D: "अनुशासनहीनता" }, correct: "B", section: "शिक्षण अभिरुचि" },
            { id: 110, text: "यदि कोई छात्र आपके पढ़ाते समय एक बहुत ही अप्रासंगिक (Irrelevant) प्रश्न पूछता है, तो आपः", options: { A: "उसे डांटकर बैठा देंगे", B: "कहेंगे कि यह विषय से बाहर है, कक्षा के अंत में चर्चा करेंगे", C: "पूरी कक्षा का समय उस पर बर्बाद करेंगे", D: "उसकी उपेक्षा करेंगे" }, correct: "B", section: "शिक्षण अभिरुचि" },
            { id: 111, text: "'बाल-केंद्रित शिक्षा' (Child-Centered Education) के प्रणेता (Pioneer) किसे माना जाता है, जिन्होंने 'लर्निंग बाय डूइंग' पर जोर दिया?", options: { A: "मैकाले", B: "जॉन डीवी (John Dewey)", C: "पावलोव", D: "थार्नडाइक" }, correct: "B", section: "शिक्षण अभिरुचि" },
            { id: 112, text: "कक्षा में 'दृश्य-श्रव्य सामग्री' (Audio-Visual Aids) का प्रयोग क्यों करना चाहिए?", options: { A: "यह शिक्षक को आराम करने का मौका देता है", B: "यह कई ज्ञानेंद्रियों (Senses) को सक्रिय करता है, जिससे अधिगम स्थायी होता है", C: "यह बच्चों का मनोरंजन करता है", D: "यह स्कूल को आधुनिक दिखाता है" }, correct: "B", section: "शिक्षण अभिरुचि" },
            { id: 113, text: "समाज में व्याप्त अंधविश्वासों (Superstitions) को दूर करने में एक शिक्षक की क्या भूमिका है?", options: { A: "उसे चुप रहना चाहिए", B: "उसे छात्रों में तर्क आधारित 'वैज्ञानिक दृष्टिकोण' (Scientific Attitude) विकसित करना चाहिए", C: "उसे धार्मिक पुस्तकें पढ़ानी चाहिए", D: "उसे पुलिस की मदद लेनी चाहिए" }, correct: "B", section: "शिक्षण अभिरुचि" },
            { id: 114, text: "'आगमन विधि' (Inductive Method) का सही क्रम क्या है?", options: { A: "नियम से उदाहरण की ओर", B: "अमूर्त से मूर्त की ओर", C: "विशिष्ट उदाहरणों से सामान्य नियम की ओर", D: "कठिन से सरल की ओर" }, correct: "C", section: "शिक्षण अभिरुचि" },
            { id: 115, text: "आप देखते हैं कि एक होशियार छात्र अति-आत्मविश्वास के कारण लगातार गलतियाँ कर रहा है। आप क्या करेंगे?", options: { A: "उसे पूरी कक्षा के सामने जलील करेंगे", B: "उसे कुछ ऐसे चुनौतीपूर्ण कार्य देंगे जिससे उसे अपनी वास्तविक क्षमता का अहसास हो", C: "उसे पढ़ाना छोड़ देंगे", D: "उसके माता-पिता को बुलाएंगे" }, correct: "B", section: "शिक्षण अभिरुचि" },
            { id: 116, text: "'प्रोजेक्ट विधि' (Project Method) के प्रतिपादक कौन थे?", options: { A: "फ्रोबेल", B: "मोंटेसरी", C: "डब्ल्यू. एच. किलपैट्रिक", D: "सुकरात" }, correct: "C", section: "शिक्षण अभिरुचि" },
            { id: 117, text: "एक उत्तम नेता (Leader) का सबसे महत्वपूर्ण गुण है:", options: { A: "तानाशाही", B: "निष्पक्षता और समूह के सदस्यों का विश्वास जीतना", C: "धनवान होना", D: "हमेशा आदेश देना" }, correct: "B", section: "शिक्षण अभिरुचि" },
            { id: 118, text: "यदि कक्षा में कुछ छात्र बार-बार स्कूल से भाग जाते हैं, तो एक शिक्षक के रूप में आपका निदानात्मक कदम क्या होगा?", options: { A: "उन्हें स्कूल से निकाल देना", B: "भागने के कारणों का पता लगाकर उन्हें दूर करना", C: "कठोर शारीरिक दंड देना", D: "अनदेखा करना" }, correct: "B", section: "शिक्षण अभिरुचि" },
            { id: 119, text: "'समीपस्थ विकास का क्षेत्र' (ZPD) का सिद्धांत किसने दिया था?", options: { A: "लेव वाइगोत्सकी", B: "जीन पियाजे", C: "बी.एफ. स्किनर", D: "अल्बर्ट बंडूरा" }, correct: "A", section: "शिक्षण अभिरुचि" },
            { id: 120, text: "PTM (Parent-Teacher Meeting) का मुख्य उद्देश्य क्या है?", options: { A: "केवल बच्चे की शिकायत करना", B: "फीस वसूलना", C: "बच्चे की प्रगति और समस्याओं के समाधान हेतु घर और स्कूल के बीच समन्वय स्थापित करना", D: "स्कूल की तारीफ करना" }, correct: "C", section: "शिक्षण अभिरुचि" },
            { id: 121, text: "कक्षा संचार (Classroom Communication) में सबसे बड़ी मनोवैज्ञानिक बाधा क्या हो सकती है?", options: { A: "बाहर का शोर", B: "शिक्षक की अस्पष्ट आवाज", C: "शिक्षक और छात्र के बीच मानसिक दूरी या अरुचि", D: "लाइट न होना" }, correct: "C", section: "शिक्षण अभिरुचि" },
            { id: 122, text: "एक शिक्षक को 'बाल मनोविज्ञान' का ज्ञान होना क्यों अनिवार्य है?", options: { A: "ताकि वह डॉक्टर बन सके", B: "ताकि वह बच्चों की विकासात्मक अवस्थाओं और व्यक्तिगत विभिन्नताओं को समझकर पढ़ा सके", C: "ताकि वह अभिभावकों पर रौब जमा सके", D: "केवल परीक्षा पास करने के लिए" }, correct: "B", section: "शिक्षण अभिरुचि" },
            { id: 123, text: "पर्यावरण अध्ययन (EVS) पढ़ाते समय 'क्षेत्र भ्रमण' (Field Trip) का क्या महत्व है?", options: { A: "समय पास करना", B: "बच्चों को प्राकृतिक वातावरण में प्रत्यक्ष अवलोकन द्वारा सीखने का अवसर देना", C: "स्कूल से दूर जाना", D: "शिक्षक को आराम देना" }, correct: "B", section: "शिक्षण अभिरुचि" },
            { id: 124, text: "यदि कोई छात्र कक्षा में चोरी करते हुए पकड़ा जाता है, तो आपः", options: { A: "पुलिस को बुलाएंगे", B: "उसे सबके सामने पीटेंगे", C: "एकांत में काउंसलिंग करेंगे और चोरी के मनोवैज्ञानिक/आर्थिक कारणों को जानकर सुधार का मौका देंगे", D: "उसे स्कूल से निकाल देंगे" }, correct: "C", section: "शिक्षण अभिरुचि" },
            { id: 125, text: "'बहु-भाषिकता' (Multilingualism) को भारतीय कक्षाओं में किस रूप में देखा जाना चाहिए?", options: { A: "एक समस्या के रूप में", B: "एक बाधा के रूप में", C: "एक संसाधन (Resource) के रूप में जिससे संज्ञानात्मक विकास होता है", D: "इसे प्रतिबंधित कर देना चाहिए" }, correct: "C", section: "शिक्षण अभिरुचि" },
            { id: 126, text: "\"बच्चे ज्ञान के सक्रिय निर्माता और नन्हें वैज्ञानिक हैं\", यह प्रसिद्ध कथन किसका है?", options: { A: "वाटसन", B: "जीन पियाजे", C: "स्किनर", D: "थार्नडाइक" }, correct: "B", section: "शिक्षण अभिरुचि" },
            { id: 127, text: "गृहकार्य (Homework) देने का सर्वोत्तम औचित्य क्या है?", options: { A: "कक्षा में सीखी गई अवधारणाओं का अभ्यास और सुदृढ़ीकरण", B: "माता-पिता को व्यस्त रखना", C: "छात्रों को खेलने से रोकना", D: "शिक्षक का काम कम करना" }, correct: "A", section: "शिक्षण अभिरुचि" },
            { id: 128, text: "'किंडरगार्टन' (Kindergarten) प्रणाली में शिक्षक को किसके समान माना गया है?", options: { A: "एक सैनिक", B: "एक माली (Gardener)", C: "एक डॉक्टर", D: "एक तानाशाह" }, correct: "B", section: "शिक्षण अभिरुचि" },
            { id: 129, text: "विद्यालय में पाठ्य सहगामी गतिविधियाँ (Co-curricular Activities) क्यों आवश्यक हैं?", options: { A: "थकान मिटाने के लिए", B: "छात्रों में छिपी प्रतिभा को निखारने और उनके सर्वांगीण विकास के लिए", C: "समय बिताने के लिए", D: "स्कूल का नाम रोशन करने के लिए" }, correct: "B", section: "शिक्षण अभिरुचि" },
            { id: 130, text: "यदि आप देखते हैं कि पीछे बैठे छात्र आपस में बात कर रहे हैं, तो आपः", options: { A: "उन पर डस्टर फेंकेंगे", B: "उन्हें कक्षा से बाहर कर देंगे", C: "उनसे पाठ से संबंधित कोई तार्किक प्रश्न पूछकर उनका ध्यान वापस पढ़ाई पर लाएंगे", D: "अनदेखा कर देंगे" }, correct: "C", section: "शिक्षण अभिरुचि" },
            { id: 131, text: "'माइक्रो-टीचिंग' (Micro-Teaching) मुख्य रूप से किसके लिए उपयोगी है?", options: { A: "छोटे बच्चों के लिए", B: "शिक्षक-प्रशिक्षण के दौरान शिक्षण कौशल विकसित करने के लिए", C: "कॉलेज के छात्रों के लिए", D: "विशेष आवश्यकता वाले बच्चों के लिए" }, correct: "B", section: "शिक्षण अभिरुचि" },
            { id: 132, text: "एक आदर्श मूल्यांकन उपकरण की तीन मुख्य विशेषताएं क्या हैं?", options: { A: "सस्ता, आसान और छोटा", B: "वैधता, विश्वसनीयता और वस्तुनिष्ठता", C: "कठिन, लंबा और व्यक्तिपरक", D: "मौखिक, लिखित और प्रायोगिक" }, correct: "B", section: "शिक्षण अभिरुचि" },
            { id: 133, text: "शिक्षक का सबसे बड़ा पुरस्कार (Reward) क्या होता है?", options: { A: "उसका उच्च वेतन", B: "समाज में रुतबा", C: "उसके छात्रों की सफलता और उनका उत्तम चारित्रिक निर्माण", D: "लंबी छुट्टियां" }, correct: "C", section: "शिक्षण अभिरुचि" },
            { id: 134, text: "RTE अधिनियम 2009 के तहत प्राथमिक स्तर पर शिक्षक-छात्र अनुपात क्या होना चाहिए?", options: { A: "1:40", B: "1:35", C: "1:30", D: "1:25" }, correct: "C", section: "शिक्षण अभिरुचि" },
            { id: 135, text: "बच्चों में नैतिक मूल्यों को स्थापित करने का सबसे सशक्त माध्यम है:", options: { A: "हर सुबह उपदेश देना", B: "शिक्षक द्वारा स्वयं का आदर्श आचरण प्रस्तुत करना", C: "नैतिक शिक्षा की किताबें रटवाना", D: "डंडे के जोर पर अनुशासन" }, correct: "B", section: "शिक्षण अभिरुचि" },
            { id: 136, text: "यदि कोई छात्र आपके आसान प्रश्न का उत्तर भी गलत देता है, तो आप 'पाड़' (Scaffolding) तकनीक का उपयोग कैसे करेंगे?", options: { A: "उसे मूर्ख कहेंगे", B: "दूसरे छात्र से उत्तर पूछ लेंगे", C: "उसे संकेत देकर स्वयं सही उत्तर तक पहुँचने में मदद करेंगे", D: "उसे सजा देंगे" }, correct: "C", section: "शिक्षण अभिरुचि" },
            { id: 137, text: "शिक्षा में 'सामाजिकरण' (Socialization) से क्या तात्पर्य है?", options: { A: "समाज से विद्रोह करना", B: "समाज के नियमों, मूल्यों और मान्यताओं को सीखना व अपनाना", C: "केवल समाजशास्त्र पढ़ना", D: "अकेले रहना" }, correct: "B", section: "शिक्षण अभिरुचि" },
            { id: 138, text: "'डिस्केल्कुलिया' (Dyscalculia) अधिगम अक्षमता किससे संबंधित है?", options: { A: "लिखने से", B: "गणितीय गणनाओं और संख्याओं को समझने से", C: "पढ़ने से", D: "भाषा समझने से" }, correct: "B", section: "शिक्षण अभिरुचि" },
            { id: 139, text: "एक प्रभावी कक्षा प्रबंधन का आधार क्या है?", options: { A: "शिक्षक का डर", B: "पिन-ड्रॉप साइलेंस", C: "छात्रों में स्व-अनुशासन और नियमों की स्पष्ट समझ", D: "लगातार मॉनिटरिंग" }, correct: "C", section: "शिक्षण अभिरुचि" },
            { id: 140, text: "आप एक शिक्षक बनना क्यों चाहते हैं?", options: { A: "इसमें छुट्टियां अधिक मिलती हैं", B: "शिक्षण कार्य में मेरी स्वाभाविक रुचि है और यह समाज निर्माण का पवित्र पेशा है", C: "कोई अन्य नौकरी नहीं मिली", D: "यह आसान काम है" }, correct: "B", section: "शिक्षण अभिरुचि" },
            { id: 141, text: "क्या एक सरकारी/कोचिंग शिक्षक को ट्यूशन पढ़ाना चाहिए?", options: { A: "हाँ, आय बढ़ाने के लिए", B: "नहीं, यह व्यावसायिक नैतिकता के खिलाफ है", C: "केवल अमीरों को", D: "प्रिंसिपल की अनुमति से" }, correct: "B", section: "शिक्षण अभिरुचि" },
            { id: 142, text: "थार्नडाइक का 'प्रभाव का नियम' (Law of Effect) अधिगम में क्या भूमिका निभाता है?", options: { A: "बार-बार अभ्यास करने की", B: "यदि अधिगम का परिणाम संतोषजनक (पुरस्कार) हो, तो बच्चा उसे जल्दी सीखता है", C: "रटने की", D: "दंड से डरने की" }, correct: "B", section: "शिक्षण अभिरुचि" },
            { id: 143, text: "यदि कक्षा में होशियार और कमजोर दोनों तरह के छात्र हैं, तो शिक्षक की गति कैसी होनी चाहिए?", options: { A: "होशियार छात्रों के अनुसार बहुत तेज", B: "कमजोर छात्रों के अनुसार बहुत धीमी", C: "औसत रखते हुए दोनों की व्यक्तिगत विभिन्नताओं का ध्यान रखना", D: "किसी की परवाह न करना" }, correct: "C", section: "शिक्षण अभिरुचि" },
            { id: 144, text: "'बुद्धिशीलता' (Brainstorming) तकनीक का मुख्य रूप से किस प्रकार के चिंतन को बढ़ावा देने के लिए उपयोग होता है?", options: { A: "अभिसारी चिंतन", B: "अपसारी चिंतन (Divergent / Out of the box)", C: "तार्किक चिंतन", D: "नकारात्मक चिंतन" }, correct: "B", section: "शिक्षण अभिरुचि" },
            { id: 145, text: "पाठ योजना (Lesson Plan) बनाने का सबसे बड़ा लाभ हैः", options: { A: "समय बिताना", B: "शिक्षण को व्यवस्थित, उद्देश्यपूर्ण और दिशा-निर्देशित करना", C: "प्रधानाचार्य को खुश करना", D: "रटने में आसानी" }, correct: "B", section: "शिक्षण अभिरुचि" },
            { id: 146, text: "'सतत एवं व्यापक मूल्यांकन' (CCE) में 'पोर्टफोलियो' का क्या उपयोग है?", options: { A: "अटेंडेंस के लिए", B: "एक निश्चित अवधि में छात्र के कार्यों, उपलब्धियों और प्रगति का संग्रह रखने के लिए", C: "केवल ड्राइंग के लिए", D: "स्कूल फीस के लिए" }, correct: "B", section: "शिक्षण अभिरुचि" },
            { id: 147, text: "एक दिव्यांग (Special needs) बच्चे के प्रति एक समावेशी शिक्षक का रवैया कैसा होना चाहिए?", options: { A: "तरस खाने वाला", B: "सहानुभूतिपूर्ण और उसे समान अवसर प्रदान करने वाला", C: "उसे अलग-थलग करने वाला", D: "कठोर" }, correct: "B", section: "शिक्षण अभिरुचि" },
            { id: 148, text: "शिक्षण में 'ज्ञात से अज्ञात की ओर' (From Known to Unknown) क्या है?", options: { A: "शिक्षण कौशल", B: "शिक्षण विधि", C: "शिक्षण सूत्र (Maxim of Teaching)", D: "मूल्यांकन विधि" }, correct: "C", section: "शिक्षण अभिरुचि" },
            { id: 149, text: "यदि एक छात्र नियमित रूप से स्कूल देर से आता है, तो निदानात्मक कदम क्या होगा?", options: { A: "उसे पीटना", B: "उसे कक्षा के बाहर खड़ा करना", C: "देर से आने के कारणों का पता लगाना", D: "उसे स्कूल से निकाल देना" }, correct: "C", section: "शिक्षण अभिरुचि" },
            { id: 150, text: "\"शिक्षा का अर्थ बच्चे की जन्मजात शक्तियों को बाहर निकालना है\", यह विचार किससे प्रेरित है?", options: { A: "केवल सिलेबस रटने से", B: "मनोवैज्ञानिक और बाल-केंद्रित दृष्टिकोण से", C: "शिक्षक-केंद्रित दृष्टिकोण से", D: "भौतिकवाद से" }, correct: "B", section: "शिक्षण अभिरुचि" },

            // खंड 4: भाषा क्षमता (English: 151-170, Hindi: 171-200)
            { id: 151, text: "Spot the error: (A) Neither the principal / (B) nor the teachers / (C) is present today. / (D) No error.", options: { A: "A", B: "B", C: "C", D: "D" }, correct: "C", section: "अंग्रेजी" },
            { id: 152, text: "Choose the correct passive voice: \"Someone has stolen my purse.\"", options: { A: "My purse was stolen.", B: "My purse has been stolen.", C: "My purse had been stolen.", D: "My purse is stolen." }, correct: "B", section: "अंग्रेजी" },
            { id: 153, text: "Fill in the blank with correct preposition: She is completely averse ___ taking risks.", options: { A: "of", B: "with", C: "to", D: "from" }, correct: "C", section: "अंग्रेजी" },
            { id: 154, text: "One word substitution: \"A person who is indifferent to pleasure or pain.\"", options: { A: "Stoic", B: "Optimist", C: "Agnostic", D: "Ascetic" }, correct: "A", section: "अंग्रेजी" },
            { id: 155, text: "Change to indirect speech: The teacher said to me, \"Do not waste your time.\"", options: { A: "The teacher told me not to waste my time.", B: "The teacher advised me not to waste my time.", C: "The teacher ordered me to not waste my time.", D: "Both A and B are correct forms, but B is more appropriate." }, correct: "B", section: "अंग्रेजी" },
            { id: 156, text: "Synonym of 'OBSOLETE':", options: { A: "Modern", B: "Outdated", C: "Absolute", D: "Rigid" }, correct: "B", section: "अंग्रेजी" },
            { id: 157, text: "Antonym of 'DILIGENT':", options: { A: "Hardworking", B: "Lazy / Lethargic", C: "Intelligent", D: "Careful" }, correct: "B", section: "अंग्रेजी" },
            { id: 158, text: "Fill in the blank: If I ___ a king, I would help the poor.", options: { A: "am", B: "was", C: "were", D: "had been" }, correct: "C", section: "अंग्रेजी" },
            { id: 159, text: "Meaning of idiom \"To spill the beans\":", options: { A: "To drop food", B: "To reveal a secret unintentionally", C: "To work hard", D: "To waste money" }, correct: "B", section: "अंग्रेजी" },
            { id: 160, text: "Identify the correctly spelt word:", options: { A: "Accomodation", B: "Accommodation", C: "Acommodation", D: "Acomodation" }, correct: "B", section: "अंग्रेजी" },
            { id: 161, text: "Fill in the blank with article: He is ___ honorable man.", options: { A: "a", B: "an", C: "the", D: "no article" }, correct: "B", section: "अंग्रेजी" },
            { id: 162, text: "He has been studying here ___ 2020.", options: { A: "for", B: "from", C: "since", D: "till" }, correct: "C", section: "अंग्रेजी" },
            { id: 163, text: "The plural of 'Criterion' is:", options: { A: "Criterions", B: "Criteria", C: "Criterias", D: "Criterion" }, correct: "B", section: "अंग्रेजी" },
            { id: 164, text: "Spot the error: (A) One of my friend / (B) has decided / (C) to go abroad. / (D) No error.", options: { A: "A", B: "B", C: "C", D: "D" }, correct: "A", section: "अंग्रेजी" },

                    else wrong++;
                }
            });
            const totalAttempted = correct + wrong;
            const score = correct * 3;

                                    </div>
                                </div>

                                <button type="submit" class="mt-8 w-full bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold py-4 rounded-xl shadow-lg hover:shadow-xl hover:from-blue-700 hover:to-indigo-700 transition-all active:scale-[0.98] text-lg flex justify-center items-center">
                                    Start Mega Mock 2026 <i data-lucide="arrow-right" class="w-5 h-5 ml-2"></i>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderExam() {
            const q = state.questions[state.currentIndex];
            const isMarked = state.markedForReview.has(q.id);
            const qAnswer = state.answers[q.id];

            // Options HTML
            let optionsHtml = '';
            ['A', 'B', 'C', 'D'].forEach(opt => {
                const isSelected = qAnswer === opt;
                const baseClass = isSelected ? 'border-blue-500 bg-blue-50 text-blue-900 shadow-sm' : 'border-gray-200 bg-white hover:border-blue-300 text-gray-700';
                const circleClass = isSelected ? 'bg-blue-500 text-white border-blue-500' : 'border-gray-300 text-gray-500';
                
                optionsHtml += `
                    <button onclick="selectOption('${opt}')" class="w-full text-left p-4 rounded-xl border-2 transition flex items-start ${baseClass}">
                        <span class="w-6 h-6 shrink-0 rounded-full flex items-center justify-center border text-sm font-bold mr-3 ${circleClass}">${opt}</span>
                        <span class="text-base pt-0.5 leading-snug">${q.options[opt]}</span>
                    </button>
                `;
            });

            // Palette HTML
            let paletteHtml = '';
            if (state.isPaletteOpen) {
                let gridItems = '';
                state.questions.forEach((pq, idx) => {
                    let statusClass = "bg-gray-100 text-gray-600 border-gray-300"; // Unanswered
                    if (state.answers[pq.id]) statusClass = "bg-green-500 text-white border-green-600 shadow-sm"; // Answered
                    if (state.markedForReview.has(pq.id)) {
                        statusClass = state.answers[pq.id] ? "bg-indigo-600 text-white shadow-sm" : "bg-yellow-500 text-white shadow-sm";
                    }
                    const activeRing = state.currentIndex === idx ? 'ring-4 ring-blue-300' : '';

                    gridItems += `<button onclick="jumpToQuestion(${idx})" class="w-10 h-10 rounded-full flex items-center justify-center font-bold text-sm border ${statusClass} ${activeRing}">${pq.id}</button>`;
                });

                paletteHtml = `
                    <div class="fixed inset-0 z-50 flex justify-end">
                        <div class="absolute inset-0 bg-black/50 backdrop-blur-sm" onclick="togglePalette(false)"></div>
                        <div class="w-80 max-w-[85vw] bg-white h-full shadow-2xl relative flex flex-col slide-in">
                            <div class="p-4 border-b bg-gray-50 flex justify-between items-center">
                                <h3 class="font-bold text-gray-800 text-lg">Question Palette</h3>
                                <button onclick="togglePalette(false)" class="p-1 hover:bg-gray-200 rounded-full"><i data-lucide="x-circle" class="text-gray-500 w-6 h-6"></i></button>
                            </div>
                            <div class="p-4 grid grid-cols-5 gap-3 overflow-y-auto flex-1 content-start">
                                ${gridItems}
                            </div>
                            <div class="p-4 border-t bg-gray-50 text-xs font-medium space-y-2.5">
                                <div class="flex items-center"><div class="w-4 h-4 rounded-full bg-green-500 mr-2 shadow-sm"></div> Answered</div>
                                <div class="flex items-center"><div class="w-4 h-4 rounded-full bg-yellow-500 mr-2 shadow-sm"></div> Marked for Review</div>
                                <div class="flex items-center"><div class="w-4 h-4 rounded-full bg-gray-100 border border-gray-300 mr-2"></div> Unanswered</div>
                                <div class="flex items-center"><div class="w-4 h-4 rounded-full bg-indigo-600 mr-2 shadow-sm"></div> Answered & Marked</div>
                            </div>
                        </div>
                    </div>
                `;
            }

            return `
                ${getHeaderHTML(`मेगा मॉक 2026 • Q. ${state.currentIndex + 1}/${state.questions.length}`, true)}
                <div class="flex-1 max-w-3xl w-full mx-auto p-4 flex flex-col">
                    <div class="flex justify-between items-center mb-4">
                        <span class="bg-gray-200 text-gray-700 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider">${q.section}</span>
                        <button onclick="togglePalette(true)" class="flex items-center text-blue-700 text-sm font-bold bg-blue-100 px-3 py-2 rounded-xl shadow-sm hover:bg-blue-200 transition">
                            <i data-lucide="menu" class="w-4 h-4 mr-1.5"></i> Palette
                        </button>
                    </div>

                    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-5 md:p-6 mb-4 flex-1">
                        <h2 class="text-lg md:text-xl font-semibold text-gray-800 leading-relaxed mb-6">
                            <span class="font-black mr-2 text-blue-600">Q.${q.id}</span> 
                            ${q.text}
                        </h2>
                        <div class="space-y-3">
                            ${optionsHtml}
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3 mt-auto">
                        <button onclick="toggleMarkForReview()" class="flex items-center justify-center p-3.5 rounded-xl font-bold text-sm transition ${isMarked ? 'bg-yellow-100 text-yellow-700 border border-yellow-300' : 'bg-gray-200 text-gray-700 hover:bg-gray-300'}">
                            <i data-lucide="bookmark" class="w-5 h-5 mr-2"></i> ${isMarked ? 'Marked' : 'Mark Review'}
                        </button>
                        <button onclick="clearAnswer()" class="flex items-center justify-center bg-gray-200 text-gray-700 p-3.5 rounded-xl font-bold text-sm transition hover:bg-gray-300">
                            <i data-lucide="x-circle" class="w-5 h-5 mr-2"></i> Clear
                        </button>
                    </div>

                    <div class="flex justify-between mt-4">
                        <button onclick="prevQuestion()" ${state.currentIndex === 0 ? 'disabled' : ''} class="flex items-center px-6 py-3.5 bg-white border border-gray-300 rounded-xl shadow-sm disabled:opacity-50 font-bold text-gray-700 hover:bg-gray-50 transition">
                            <i data-lucide="chevron-left" class="w-5 h-5 mr-1"></i> Prev
                        </button>
                        
                        ${state.currentIndex === state.questions.length - 1 
                            ? `<button onclick="submitExam()" class="flex items-center px-8 py-3.5 bg-green-600 text-white rounded-xl shadow-md font-bold hover:bg-green-700 transition active:scale-95">Submit Exam</button>`
                            : `<button onclick="nextQuestion()" class="flex items-center px-6 py-3.5 bg-blue-600 text-white rounded-xl shadow-md font-bold hover:bg-blue-700 transition active:scale-95">Next <i data-lucide="chevron-right" class="w-5 h-5 ml-1"></i></button>`
                        }
                    </div>
                </div>
                ${paletteHtml}
            `;
        }

        function renderResult() {
            if (!state.isResultSent) {
                return `
                    ${getHeaderHTML("Exam Submitted Successfully", false)}
                    <div class="flex-1 max-w-lg w-full mx-auto p-4 py-8 flex flex-col items-center justify-center">
                        <div class="bg-white w-full rounded-3xl shadow-xl p-8 mb-6 text-center border-t-8 border-amber-500">
                            <div class="bg-amber-100 w-24 h-24 rounded-full flex items-center justify-center mx-auto mb-6">
                                <i data-lucide="lock" class="w-12 h-12 text-amber-600"></i>
                            </div>
                            <h2 class="text-3xl font-black text-gray-800 mb-3">Result Locked!</h2>
                            <p class="text-gray-600 mb-8 font-medium text-lg">Please submit your exam result to the Admin via WhatsApp to unlock your scorecard and detailed answer review.</p>
                            
                            <button onclick="sendWhatsAppResult()" class="w-full bg-[#25D366] text-white font-bold py-4 rounded-xl shadow-lg hover:bg-[#1ebe5d] transition flex items-center justify-center text-lg active:scale-95">
                                <i data-lucide="send" class="w-6 h-6 mr-2"></i> Send Result to Unlock
                            </button>
                        </div>
                    </div>
                `;
            }

            const stats = calculateScore();
            return `
                ${getHeaderHTML("Unlocked Scorecard", false)}
                <div class="flex-1 max-w-lg w-full mx-auto p-4 py-8 flex flex-col items-center">
                    <div class="bg-white w-full rounded-3xl shadow-xl p-8 mb-6 text-center border-t-8 border-green-500">
                        <i data-lucide="check-circle" class="w-16 h-16 mx-auto text-green-500 mb-4"></i>
                        <h2 class="text-3xl font-black text-gray-800 mb-1">Test Completed!</h2>
                        <p class="text-gray-500 mb-8 font-medium">${state.student.name} • ${state.student.city}</p>
                        
                        <div class="grid grid-cols-2 gap-4 mb-8">
                            <div class="bg-blue-50 p-5 rounded-2xl border border-blue-100">
                                <div class="text-4xl font-black text-blue-600">${stats.score}</div>
                                <div class="text-xs font-bold text-blue-800 uppercase tracking-wide mt-2">Total Marks</div>
                                <div class="text-[10px] text-blue-500 font-medium">Out of ${stats.maxScore}</div>
                            </div>
                            <div class="bg-orange-50 p-5 rounded-2xl border border-orange-100">
                                <div class="text-4xl font-black text-orange-600">${stats.percentage}%</div>
                                <div class="text-xs font-bold text-orange-800 uppercase tracking-wide mt-2">Accuracy</div>
                            </div>
                        </div>

                        <div class="flex justify-center space-x-8 text-sm">
                            <div class="flex flex-col items-center">
                                <span class="w-10 h-10 rounded-full bg-green-100 text-green-600 flex items-center justify-center font-bold text-lg mb-1.5 shadow-sm">${stats.correct}</span>
                                <span class="text-gray-600 font-semibold">Correct</span>
                            </div>
                            <div class="flex flex-col items-center">
                                <span class="w-10 h-10 rounded-full bg-red-100 text-red-600 flex items-center justify-center font-bold text-lg mb-1.5 shadow-sm">${stats.wrong}</span>
                                <span class="text-gray-600 font-semibold">Wrong</span>
                            </div>
                            <div class="flex flex-col items-center">
                                <span class="w-10 h-10 rounded-full bg-gray-100 text-gray-600 flex items-center justify-center font-bold text-lg mb-1.5 shadow-sm">${state.questions.length - stats.totalAttempted}</span>
                                <span class="text-gray-600 font-semibold">Skipped</span>
                            </div>
                        </div>
                    </div>

                    <button onclick="goToReview()" class="w-full bg-blue-900 text-white font-bold py-4 rounded-xl shadow-md hover:bg-blue-800 transition active:scale-95 text-lg flex items-center justify-center">
                        <i data-lucide="book-open" class="w-5 h-5 mr-2"></i> Review Answers
                    </button>
                </div>
            `;
        }

        function renderReview() {
            const stats = calculateScore();
            let questionsHtml = '';

            state.questions.forEach((q) => {
                const studentAns = state.answers[q.id];
                const isCorrect = studentAns === q.correct;
                const isAttempted = !!studentAns;

                let iconHtml = isAttempted 
                    ? (isCorrect ? `<i data-lucide="check-circle" class="text-green-500 shrink-0 ml-2 w-6 h-6"></i>` : `<i data-lucide="x-circle" class="text-red-500 shrink-0 ml-2 w-6 h-6"></i>`)
                    : `<i data-lucide="alert-circle" class="text-gray-400 shrink-0 ml-2 w-6 h-6"></i>`;

                let optionsHtml = '';
                ['A', 'B', 'C', 'D'].forEach(opt => {
                    let optStyle = "border-gray-200 text-gray-600 bg-gray-50";
                    let optIcon = '';

                    if (opt === q.correct) {
                        optStyle = "bg-green-100 border-green-500 text-green-900 font-bold shadow-sm";
                        optIcon = `<i data-lucide="check" class="text-green-600 ml-auto w-5 h-5"></i>`;
                    } else if (studentAns === opt && !isCorrect) {
                        optStyle = "bg-red-50 border-red-400 text-red-800 font-semibold";
                        optIcon = `<i data-lucide="x-circle" class="text-red-500 ml-auto w-5 h-5"></i>`;
                    }

                    optionsHtml += `
                        <div class="w-full text-left p-3.5 rounded-xl border flex items-center ${optStyle}">
                            <span class="font-black mr-3 w-5 text-lg">${opt}.</span>
                            <span class="text-sm md:text-base">${q.options[opt]}</span>
                            ${optIcon}
                        </div>
                    `;
                });

                let notAttemptedWarning = !isAttempted ? `<div class="mt-4 text-xs font-bold text-amber-700 bg-amber-50 border border-amber-200 px-3 py-2 rounded-lg flex items-center"><i data-lucide="alert-circle" class="w-4 h-4 mr-1"></i> Not Attempted. Correct Answer: ${q.correct}</div>` : '';

                questionsHtml += `
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-5 mb-4">
                        <div class="flex items-start justify-between mb-4">
                            <h3 class="font-semibold text-gray-800 text-lg leading-snug">
                                <span class="font-black text-gray-400 mr-2">Q.${q.id}</span>
                                ${q.text}
                            </h3>
                            ${iconHtml}
                        </div>
                        <div class="space-y-2.5">
                            ${optionsHtml}
                        </div>
                        ${notAttemptedWarning}
                    </div>
                `;
            });

            return `
                <div class="bg-blue-900 text-white p-4 sticky top-0 z-40 shadow-md flex items-center justify-between">
                    <div class="flex items-center">
                        <button onclick="goToResult()" class="mr-3 hover:bg-blue-800 p-1.5 rounded-full transition"><i data-lucide="chevron-left" class="w-6 h-6"></i></button>
                        <h1 class="text-lg font-bold">Answer Review</h1>
                    </div>
                    <span class="bg-white text-blue-900 px-4 py-1.5 rounded-full text-sm font-black shadow-sm">${stats.score} / ${stats.maxScore}</span>
                </div>
                <div class="max-w-3xl w-full mx-auto p-4 space-y-4">
                    ${questionsHtml}
                </div>
            `;
        }

        // --- MAIN RENDER FUNCTION ---
        function render() {
            const app = document.getElementById('app');
            switch (state.view) {
                case 'register': app.innerHTML = renderRegister(); break;
                case 'exam': app.innerHTML = renderExam(); break;
                case 'result': app.innerHTML = renderResult(); break;
                case 'review': app.innerHTML = renderReview(); break;
            }
            // Initialize Lucide icons after DOM update
            lucide.createIcons();
            window.scrollTo(0, 0); // Reset scroll on view change
        }

        // --- INITIALIZE ---
        document.addEventListener('DOMContentLoaded', () => {
            render();
        });

    </script>
</body>
</html>
